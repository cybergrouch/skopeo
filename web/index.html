<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Tab favicon is SVG-only and fully theme-driven (#386): ThemeProvider recolors an inline SVG
      data-URI icon link to the active seasonal accent. This static SVG link is the pre-hydration
      brand mark; the dynamic themed link (appended by ThemeProvider) supersedes it. SVG favicons
      work in modern Chrome/Firefox/Edge and Safari 16.4+ — no .ico/.png tab fallback is shipped.
      iOS home-screen (apple-touch-icon.png) and PWA installed-app icons (site.webmanifest) require
      PNG and stay the static, unthemed brand mark.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Skopeo" />
    <!--
      Installed-app / edge-to-edge plumbing for the umpire view (#1076). The umpire view is sized in
      `dvh` and forbidden to scroll (#911), so a reserved OS band is not cosmetic — it steals height
      from a layout that has nowhere to put the overflow. These four declarations reclaim it:

      - `viewport-fit=cover` lets the page draw into the safe-area insets instead of being letterboxed
        inside them. It is the prerequisite for the rest, and it applies to EVERY page — which is why
        the shared gutter (PageContainer) and every element pinned to a viewport edge now pad
        themselves with `max(<old value>, env(safe-area-inset-*))`.
      - `mobile-web-app-capable` / `apple-mobile-web-app-capable` run an installed home-screen launch
        without browser chrome. The modern name is the unprefixed one; the Apple-prefixed name is kept
        because iOS still reads it and ignoring it costs an iOS user the whole benefit.
      - `apple-mobile-web-app-status-bar-style=black-translucent` makes iOS draw content *under* the
        status bar rather than below it. That is what actually returns the height — but the status-bar
        icons are then composited over our canvas, so the top inset is a place for background, not for
        text. Anything readable there needs `padding-top: env(safe-area-inset-top)`.

      What this does NOT do: there is no web API that hides the status bar in an iOS Safari *tab*.
      See `web/src/features/livematch/useLockedLandscape.ts` for the per-platform ceiling.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Skopeo</title>
    <meta
      name="description"
      content="Skopeo calculates performance-based NTRP tennis ratings from your match results."
    />
    <!--
      Default Open Graph / Twitter Card tags (#192 follow-up) so shared links render a brand card on
      Facebook/X/LinkedIn/WhatsApp/iMessage. These are static/site-wide: crawlers read the initial HTML
      and don't run the SPA, so per-page (per match/player/event) tags need a server-side responder —
      tracked separately. og:image/url are absolute (crawlers require it).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skopeo" />
    <meta property="og:title" content="Skopeo — performance-based tennis ratings" />
    <meta
      property="og:description"
      content="Skopeo calculates performance-based NTRP tennis ratings from your match results."
    />
    <meta property="og:url" content="https://skopeo.co" />
    <meta property="og:image" content="https://skopeo.co/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skopeo — performance-based tennis ratings" />
    <meta
      name="twitter:description"
      content="Skopeo calculates performance-based NTRP tennis ratings from your match results."
    />
    <meta name="twitter:image" content="https://skopeo.co/og-cover.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
