  /api/v1/events/{id}/seeding:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Generate (or regenerate) a seeding from an event's participants (#714)
      description: >-
        Rating-sorted (highest first) over the event's APPROVED participants; the top ⌈N/2⌉ rated
        members get bracket seeds — the same deterministic seeding + CSV export as the Seeding tab.
        Regenerating overwrites the event's previous seeding. Staff-only; a HOST may seed only their own
        event, an ADMINISTRATOR/CLUB_OWNER any. Doubles events are still seeded by player (a known
        limitation).
      tags:
        - Events
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The generated seeding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedingResponse'
        '403':
          description: Caller is not staff, or may not organize this event (#789)
        '404':
          description: No such event
    put:
      summary: Save a hand-reordered event seeding (#718)
      description: >-
        Persist the host's manual drag-and-drop order for the event's seeding. The request lists the
        seedable participants' user ids in the desired order; seeds are renumbered 1..N by the new
        position (reordering reassigns seed numbers) and the seeding is marked manually edited. The ids
        must be exactly the current seedable set (a permutation) — no additions or removals. Same
        staff/owner gating as generate.
      tags:
        - Events
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSeedingOrderRequest'
      responses:
        '200':
          description: The saved, renumbered seeding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedingResponse'
        '400':
          description: The order is not exactly the current seedable set
        '403':
          description: Caller is not staff, or may not organize this event (#789)
        '404':
          description: No such event
    get:
      summary: Get the current seeding for an event (#714)
      tags:
        - Events
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The current seeding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedingResponse'
        '403':
          description: Caller is not staff, or may not organize this event (#789)
        '404':
          description: No such event, or no seeding generated yet

