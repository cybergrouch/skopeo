      description: >-
        The organizer payload for an event addressed by its public code — the same body and staff
        gating as GET /api/v1/events/{id}. `/events/{code}` is the single event view for every
        audience, so a staff viewer loads the organizer fields (and the event id every mutation route
        is keyed by) from here alongside the public read.
      tags:
        - Events
      security:
        - firebaseAuth: []
      responses:
