openapi: 3.0.0
info:
  title: Skopeo API
  version: 1.0.0
  description: Performance-based tennis ranking calculation API using the NTRP rating system

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://skopeo.co
    description: Production (proxied to the API via Firebase Hosting)

tags:
  - name: Rankings
    description: Rating calculation endpoints
  - name: Users
    description: User management — provisioning and profile CRUD (Firebase-authenticated)
  - name: Contacts
    description: Email/phone management; verification is an ADMINISTRATOR action
  - name: Names
    description: Append-only user names; the display name is a DISPLAY-typed name
  - name: Capabilities
    description: User roles (admin-only); append-only grants with audit
  - name: Ratings
    description: Player ratings & assessment; initial ratings are administrator-set
  - name: Matches
    description: Match fixtures & results (append-only); ratings calculated separately
  - name: Invites
    description: Admin onboarding invites for manual (email-link) sign-ups
  - name: Player Lists
    description: Host-curated player lists and generated seedings (HOST/CLUB_OWNER/ADMINISTRATOR)
  - name: Standings
    description: Per-band "Ranking Race" standings (interim, ratings-derived); any signed-in player
  - name: Ranking Points
    description: Append-only ranking-points ledger; admins grant/revoke awards (manual & ad-hoc)
  - name: Settings
    description: Global app settings; the UI theme is publicly readable and administrator-writable
  - name: Circuits
    description: Administrator-defined groupings of tournaments (e.g. NORTH, SOUTH)
  - name: Client API
    description: Partner application identity — admin-managed API clients/keys, and client-key-authenticated reads

paths:
  /api/v1/calculate-ranking:
    post:
      summary: Calculate ranking changes
      description: |
        Calculates rating changes for players based on match results.
        Uses the NTRP (National Tennis Rating Program) system.

        The algorithm uses a performance-based Elo calculation that considers:
        - Current player ratings and rating difference
        - Match score and game margins
        - Dominance factor (games won ratio)
        - Expected vs actual performance

        Returns updated ratings with published levels and percentage changes.
      tags:
        - Rankings
      requestBody:
        required: true
        description: Match details and player ratings
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RankingCalculationRequest'
            examples:
              singles:
                summary: Singles (1 player per team)
                value:
                  teams:
                    T1:
                      teamId: "T1"
                      name: "Player 1"
                      players:
                        - playerId: "P1"
                          name: "Player 1"
                          rating:
                            value: "4.5"
                      teamType: "SINGLES"
                    T2:
                      teamId: "T2"
                      name: "Player 2"
                      players:
                        - playerId: "P2"
                          name: "Player 2"
                          rating:
                            value: "4.0"
                      teamType: "SINGLES"
                  matchScore:
                    sets:
                      - games:
                          T1: 6
                          T2: 2
                        winnerTeamId: "T1"
              doubles:
                summary: Doubles (2 players per team; both teams must share the same format)
                description: >-
                  A team is evaluated at the mean of its two partners' ratings; the team's change is split
                  back to each partner in proportion to their share of that mean. MIXED_DOUBLES is scored
                  identically to DOUBLES.
                value:
                  teams:
                    T1:
                      teamId: "T1"
                      name: "Team 1"
                      players:
                        - playerId: "P1"
                          name: "Player 1"
                          rating:
                            value: "5.0"
                        - playerId: "P2"
                          name: "Player 2"
                          rating:
                            value: "3.0"
                      teamType: "DOUBLES"
                    T2:
                      teamId: "T2"
                      name: "Team 2"
                      players:
                        - playerId: "P3"
                          name: "Player 3"
                          rating:
                            value: "4.0"
                        - playerId: "P4"
                          name: "Player 4"
                          rating:
                            value: "4.0"
                      teamType: "DOUBLES"
                  matchScore:
                    sets:
                      - games:
                          T1: 6
                          T2: 4
                        winnerTeamId: "T1"
      responses:
        '200':
          description: Successfully calculated rating changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingCalculationResponse'
        '400':
          description: Invalid request (validation error or malformed JSON)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/search:
    get:
      summary: Paged player search with a total count (#232)
      description: >-
        Same filters as `GET /api/v1/users` search mode (name/code/q/sex/age/rating; at least one
        required), but returns a page `{ items, total }` so the UI can show the current page, links to
        other pages, and the total. RESEARCHER, RATER, HOST, or ADMINISTRATOR.
      tags:
        - Users
      security:
        - firebaseAuth: []
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Fuzzy name fragment.
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Shareable player-code prefix, case-insensitive.
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Unified term — fuzzy name OR code prefix.
        - name: sex
          in: query
          required: false
          schema:
            type: string
            enum: [Male, Female]
        - name: age
          in: query
          required: false
          schema:
            type: string
          description: 'Age interval of whole numbers, e.g. "(20,30]".'
        - name: rating
          in: query
          required: false
          schema:
            type: string
          description: 'NTRP rating interval, e.g. "[3.0,4.0)".'
        - name: capability
          in: query
          required: false
          schema:
            type: string
            enum: [PLAYER, HOST, CLUB_OWNER, ADMINISTRATOR, RATER, RESEARCHER, POINTS_MANAGER]
          description: Restrict to users holding this capability (#317), e.g. CLUB_OWNER.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Page size; coerced to 1..100, default 20.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
          description: Results to skip for pagination; default 0.
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
          description: >-
            Include soft-deleted/inactive accounts (flagged `isDeleted`), for the Research tab (#518).
            Default false, so normal search and pickers stay active-only.
      responses:
        '200':
          description: A page of matching users with the total count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummaryPageResponse'
        '400':
          description: No filter given, or a malformed age/rating interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Firebase token
        '403':
          description: Caller lacks search access

  /api/v1/users:
    get:
      summary: Look up users by id (HOST/ADMINISTRATOR), or search by name/sex/age/rating (RESEARCHER or staff)
      description: |
        Two modes:
          - **Id resolution** — `ids` (comma-separated UUIDs) resolves known ids to summaries
            (match rosters, rating history, calculation previews); HOST/ADMINISTRATOR only. Exclusive:
            it cannot be combined with the search filters below.
          - **Search** — RESEARCHER or staff (#107). Any combination of `name`, `code`, `q`, `sex`, `age`, `rating`
            (AND-combined; at least one required). `name` is a fuzzy, partial match across all of
            a profile's names; `code` is a player-code prefix; `q` is a unified term matching a
            fuzzy name OR a code prefix. `age` and `rating` are interval strings: `[` / `]`
            inclusive, `(` / `)`
            exclusive, an empty side is unbounded — e.g. `(3.0,4.0)`, `[3.0,4.0)`, `(20,30]`,
            `[3.0,)`. Rating filters the NTRP rating.
        Returns slim summaries (no contacts/identities); capped server-side.
      tags:
        - Users
      security:
        - firebaseAuth: []
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Fuzzy name fragment (search mode).
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Shareable player-code prefix, case-insensitive (search mode).
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: >-
            Unified picker term — matches a fuzzy name OR a player-code prefix (search mode), so
            typing either surfaces players incrementally.
        - name: sex
          in: query
          required: false
          schema:
            type: string
            enum: [Male, Female]
          description: Exact sex filter (search mode).
        - name: age
          in: query
          required: false
          schema:
            type: string
          description: 'Age interval of whole numbers, e.g. "(20,30]" (search mode).'
        - name: rating
          in: query
          required: false
          schema:
            type: string
          description: 'NTRP rating interval, e.g. "[3.0,4.0)" (search mode).'
        - name: capability
          in: query
          required: false
          schema:
            type: string
            enum: [PLAYER, HOST, CLUB_OWNER, ADMINISTRATOR, RATER, RESEARCHER, POINTS_MANAGER]
          description: Restrict to users holding this capability (#317), e.g. CLUB_OWNER.
        - name: ids
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated UUIDs to resolve (exclusive; not combinable with filters).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Max results to return (search mode); coerced to 1..100, default 20.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
          description: Number of results to skip (search mode) for pagination; default 0.
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
          description: >-
            Include soft-deleted/inactive accounts (flagged `isDeleted`), for the Research tab (#518).
            Default false, so pickers/normal search stay active-only.
      responses:
        '200':
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummaryResponse'
        '400':
          description: Neither or both of name/ids given, blank name, or a malformed id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Firebase token
        '403':
          description: Caller is not HOST or ADMINISTRATOR
    post:
      summary: Provision the authenticated user
      description: |
        The single final step of every sign-up flow (Google, Facebook, manual).
        Identity (firebase uid, email, sign-in provider, photo) is taken from the
        verified Firebase token — never the request body. Idempotent: re-posting with
        an already-known uid returns the existing user with 200 instead of 201.
      tags:
        - Users
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '200':
          description: User already existed (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Firebase token
        '403':
          description: >-
            A manual (password/email-link) sign-up whose email has no open invite (issue #74).
            OAuth sign-ups are exempt.

  /api/v1/users/placeholders:
    post:
      summary: Create a login-less placeholder ("dummy") player (#496)
      description: |
        HOST/CLUB_OWNER/ADMINISTRATOR only; no invite gate. Creates a login-less user
        (firebase_uid = NULL, placeholder = true) with an auto public code, a DISPLAY name, and the
        PLAYER capability only, so matches can be logged against a person who hasn't signed up yet.
        `displayName` and `sex` are required; `dateOfBirth` is optional.
      tags:
        - Users
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaceholderRequest'
      responses:
        '201':
          description: Placeholder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Missing display name or invalid sex
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Firebase token
        '403':
          description: Caller lacks a match-management capability (HOST/CLUB_OWNER/ADMINISTRATOR)
    get:
      summary: List unclaimed placeholder players (#496)
      description: |
        HOST/CLUB_OWNER/ADMINISTRATOR only. Returns the active, unclaimed placeholders for the
        management view (list, generate claim code, deactivate).
      tags:
        - Users
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: Unclaimed placeholders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummaryResponse'
        '401':
          description: Missing or invalid Firebase token
        '403':
          description: Caller lacks a match-management capability

  /api/v1/users/{id}/claim-code:
    post:
      summary: Generate a secret claim code for a placeholder (#496)
      description: |
        ADMINISTRATOR only. The backend generates a cryptographically-random, one-time, expiring
        (7-day) claim code, stores only its hash, supersedes any prior active code, and returns the
        plaintext once. The admin hands the code to the verified person out-of-band. Valid only for a
        placeholder that has not been claimed.
      tags:
        - Users
      security:
        - firebaseAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The placeholder user's id.
      responses:
        '201':
          description: Claim code generated (plaintext returned once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimCodeResponse'
        '400':
          description: The target user is not a placeholder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Firebase token
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The placeholder has already been claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/claim:
    post:
      summary: Claim (adopt) a placeholder account by code (#496)
      description: |
        Any authenticated user. The caller pastes the secret claim code; if it hashes to an active,
        non-expired record and the caller's account is empty (no rating history and no match
        participation) and is not itself a placeholder, the placeholder's history is merged into the
        caller's account, the placeholder is retired via the canonical-link pattern, and the code is
        consumed. Rejected on a bad/expired/consumed code, a non-empty caller account, or a
        caller-is-placeholder.
      tags:
        - Users
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '200':
          description: Placeholder claimed; the caller's (now-merged) profile is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Missing code or the code has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Firebase token
        '403':
          description: Caller is not signed up
        '404':
          description: Unknown/invalid claim code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Caller account is non-empty, or already-claimed placeholder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/me:
    get:
      summary: Get the authenticated user's own profile
      tags:
        - Users
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The caller's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or invalid Firebase token
        '404':
          description: Caller has not been provisioned yet (POST /api/v1/users first)

  /api/v1/players/{code}:
    get:
      summary: Resolve a player's shareable public profile by code (viewable without login, #193)
      tags:
        - Users
      security:
        - firebaseAuth: []
        - {}
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The player's shareable public code (case-insensitive).
      responses:
        '200':
          description: The player's limited public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPlayerResponse'
        '401':
          description: Missing or invalid Firebase token
        '404':
          description: No active player with that code

  /api/v1/players/{code}/match-history:
    get:
      summary: A page of a player's match history by code (viewable without login, #193; privacy-conscious)
      description: >-
        A page of the player's matches (scheduled, completed, and rated), newest first, optionally
        narrowed by `search`. Returns the requested slice plus the total matching count (#284), for a
        bounded profile preview and a numbered full-history page. Ratings appear only as the published
        NTRP band at the time of the match, and only for rated matches.
      tags:
        - Users
      security:
        - firebaseAuth: []
        - {}
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The player's shareable public code (case-insensitive).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Page size (1–100; default 20).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Number of matching matches to skip.
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive substring over opponent/partner display names and public codes.
        - name: opponentBand
          in: query
          required: false
          schema:
            type: string
          description: >-
            Keep only matches where an opponent's NTRP band at the time of the match equals this
            value (e.g. "4.0"). Blank/absent applies no band filter.
      responses:
        '200':
          description: A page of the player's match history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerMatchHistoryPage'
        '401':
          description: Missing or invalid Firebase token
        '404':
          description: No active player with that code

  /api/v1/players/{code}/events:
    get:
      summary: A player's event-participation history by code (viewable without login, #704)
      description: >-
        Every event the player is signed up for, in any status, with their standing and a recorded-
        result count, resolved by public code. Parity with the owner dashboard's /api/v1/events/mine;
        events are already publicly shareable via /api/v1/events/code/{code}, so this is not further
        gated. Returns the same MyEventResponse shape so the public profile renders it identically.
      tags:
        - Users
      security:
        - firebaseAuth: []
        - {}
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The player's shareable public code (case-insensitive).
      responses:
        '200':
          description: The player's event-participation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyEventResponse'
        '401':
          description: Missing or invalid Firebase token
        '404':
          description: No active player with that code

  /api/v1/players/{code}/results-summary:
    get:
      summary: A player's win–loss record over time by code (viewable without login, #193)
      description: >-
        Win/loss counts bucketed by calendar month and split into singles vs doubles (MIXED_DOUBLES
        counts as doubles), over every decided match the player took part in. Aggregated server-side,
        so it is independent of how match history is listed/paginated. No ratings are exposed.
      tags:
        - Users
      security:
        - firebaseAuth: []
        - {}
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The player's shareable public code (case-insensitive).
      responses:
        '200':
          description: The player's win–loss summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResultsSummary'
        '401':
          description: Missing or invalid Firebase token
        '404':
          description: No active player with that code

  /api/v1/players/{code}/rating-history:
    get:
      summary: A player's rating history by code (ADMINISTRATOR only)
      description: >-
        The precise rating-history audit view for any player, resolved by public code. Unlike match
        history this exposes full rating values alongside the published bands, so it is restricted to
        ADMINISTRATORs (the owner reads their own history via /api/v1/users/{id}/rating-history).
      tags:
        - Users
      security:
        - firebaseAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The player's shareable public code (case-insensitive).
      responses:
        '200':
          description: The player's rating history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RatingHistoryResponse'
        '401':
          description: Missing or invalid Firebase token
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No active player with that code

  /api/v1/players/{code}/standing:
    get:
      summary: A player's band+sex rank and points by code (viewable without login, #448)
      description: >-
        The player's rank within their (NTRP band, sex) group and the points backing it, under the
        active standings source (#424). Order and points are public (#64/#114), so this is viewable
        without login on the public profile. An unranked player (unrated, or no points in the current
        standings) yields 204 No Content, which the UI renders as "unranked".
      tags:
        - Users
      security:
        - firebaseAuth: []
        - {}
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The player's shareable public code (case-insensitive).
      responses:
        '200':
          description: The player's current band+sex rank and points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStandingResponse'
        '204':
          description: The player is unranked (unrated, or absent from the current standings)
        '404':
          description: No active player with that code

  /api/v1/players/{code}/points:
    get:
      summary: A player's active ranking-point awards by code (owner or ADMINISTRATOR only, #448)
      description: >-
        The profile points audit — the player's ACTIVE ranking-point awards (status ACTIVE and now
        within their validity window). Each award carries its points, band, expiry (validUntil), and a
        link to the granting match (its public code); an award with no match link (a manual grant or a
        pre-V19 finalize award) falls back to the event code. Visible only to the profile owner and to
        ADMINISTRATORs; other and anonymous viewers get 403.
      tags:
        - Users
      security:
        - firebaseAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: The player's shareable public code (case-insensitive).
      responses:
        '200':
          description: The player's active ranking-point awards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivePointsAwardResponse'
        '401':
          description: Missing or invalid Firebase token
        '403':
          description: Caller is neither the owner nor an ADMINISTRATOR
        '404':
          description: No active player with that code

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a user by id
      description: Permitted only for the user themselves or an ADMINISTRATOR.
      tags:
        - Users
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The requested user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Malformed id
        '401':
          description: Missing or invalid Firebase token
        '403':
          description: Caller is neither the target user nor an ADMINISTRATOR
        '404':
          description: No such user
    patch:
      summary: Partially update a user's profile
      description: Omitted (null) fields are left unchanged. Self-or-ADMINISTRATOR only.
      tags:
        - Users
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid body or malformed id
        '403':
          description: Forbidden
        '404':
          description: No such user
    put:
      summary: Replace a user's mutable profile fields
      description: Replaces dateOfBirth/sex/city wholesale — omitted fields are cleared. The photo is set separately via PUT /photo (#303). Self-or-ADMINISTRATOR only.
      tags:
        - Users
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid body or malformed id
        '403':
          description: Forbidden
        '404':
          description: No such user
    delete:
      summary: Delete (soft-delete) an account
      description: >-
        Sets `is_active = false`, retaining the row and all history (matches, ratings, points).
        ADMINISTRATOR only (#518) — there is no owner self-delete. Rejected with 400 when the target is
        the last active ADMINISTRATOR. The account is then blocked from signing in until an admin
        re-allows login (see `POST /api/v1/users/{id}/reactivate`). Audited.
      tags:
        - Users
      security:
        - firebaseAuth: []
      responses:
        '204':
          description: Account deleted
        '400':
          description: Cannot delete the last active ADMINISTRATOR
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such user

  /api/v1/users/{id}/reactivate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Re-allow login for a soft-deleted account (#518)
      description: >-
        Flips `is_active` back to true, restoring sign-in for an admin-deleted account. ADMINISTRATOR
        only; audited. A deleted account has no canonical pointer, so this is a pure reactivation.
      tags:
        - Users
      security:
        - firebaseAuth: []
      responses:
        '204':
          description: Login re-allowed
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such user

  /api/v1/users/{id}/photo:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Set a user's profile-photo controls
      description: >-
        Sets a custom public image URL (blank/absent clears it, reverting to the OAuth photo) and a
        hide flag. A user-set custom photo or a hide is never overwritten by the login-time OAuth
        photo sync (#303). Self-or-ADMINISTRATOR only.
      tags:
        - Users
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoSettingsRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid body (e.g. customPhotoUrl is not an http(s) URL) or malformed id
        '401':
          description: Missing or invalid Firebase token
        '403':
          description: Caller is neither the target user nor an ADMINISTRATOR
        '404':
          description: No such user

  /api/v1/users/{id}/match-history-visibility:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Set a user's match-history visibility
      description: >-
        Sets the per-player "hide match history from other players" flag (#622). When true, the
        public profile withholds the player's match history from unprivileged viewers (plain players
        and anonymous callers); the owner and elevated roles still see it. Self-or-ADMINISTRATOR only.
      tags:
        - Users
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchHistoryVisibilityRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or invalid Firebase token
        '403':
          description: Caller is neither the target user nor an ADMINISTRATOR
        '404':
          description: No such user

  /api/v1/users/{id}/duplicates:
    parameters:
      - name: id
        in: path
        required: true
        description: The canonical ("true") account the duplicates are attributed to.
        schema:
          type: string
          format: uuid
    post:
      summary: Mark users as duplicates of this canonical account (#124)
      description: ADMINISTRATOR only. Disables each listed user and points it at the canonical account; reversible and audit-logged. Ratings are not consolidated.
      tags:
        - Users
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkDuplicatesRequest'
      responses:
        '200':
          description: The canonical account's duplicates after marking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummaryResponse'
        '400':
          description: Empty/duplicate ids, self-reference, or a malformed id
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such canonical or duplicate user
        '409':
          description: The canonical is itself a duplicate, or a target is itself a canonical
    get:
      summary: List the duplicates of this canonical account (#124)
      description: ADMINISTRATOR only — backs the un-mark (restore) view.
      tags:
        - Users
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The disabled duplicates pointing at this account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummaryResponse'
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such user

  /api/v1/users/{id}/duplicate:
    parameters:
      - name: id
        in: path
        required: true
        description: A user currently marked as a duplicate.
        schema:
          type: string
          format: uuid
    delete:
      summary: Restore a user from duplicate status (#124)
      description: ADMINISTRATOR only. Reactivates the user and clears its canonical pointer; audit-logged.
      tags:
        - Users
      security:
        - firebaseAuth: []
      responses:
        '204':
          description: User restored
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such user
        '409':
          description: The user is not marked as a duplicate

  /api/v1/users/{id}/duplicates/{duplicateId}/replace:
    parameters:
      - name: id
        in: path
        required: true
        description: The canonical ("true", surviving) account that replaces the old one.
        schema:
          type: string
          format: uuid
      - name: duplicateId
        in: path
        required: true
        description: The old account (already marked a duplicate of this canonical) to import and delete.
        schema:
          type: string
          format: uuid
    post:
      summary: Replace an old account with its canonical account (#124)
      description: >-
        ADMINISTRATOR only. Imports the old (marked-duplicate) account's matches, current rating, rating
        history, points, and memberships into the canonical account, then deletes the old account (admin
        soft-delete). Gated to an empty canonical (no rating/matches of its own). Irreversible; audit-logged.
      tags:
        - Users
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The canonical account after the replace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummaryResponse'
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such canonical or duplicate user
        '409':
          description: The canonical is itself a duplicate, the target is not a duplicate of it, or the canonical is not empty

  /api/v1/users/{id}/merge:
    parameters:
      - name: id
        in: path
        required: true
        description: The survivor account that keeps its rating, ranking points, and records.
        schema:
          type: string
          format: uuid
    post:
      summary: Merge accounts into this survivor (#643)
      description: >-
        ADMINISTRATOR only. Consolidates the retired account into this survivor: moves all
        participation/membership records (matches, event participants, player-list members, club owners,
        seeding entries) onto the survivor while the survivor keeps its own rating and ranking points (no
        recompute). The survivor keeps the best available login — when the retired account has one it is
        transferred to the survivor. The retired account is retired as a "merged → survivor" card. A
        required, non-blank verification note is recorded in the audit trail. Irreversible; audit-logged.
      tags:
        - Users
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeAccountsRequest'
      responses:
        '200':
          description: The survivor account after the merge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummaryResponse'
        '400':
          description: A blank verification note, a malformed id, or the survivor equals the retired account
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such survivor or retired account

  /api/v1/users/{userId}/contacts:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List a user's contacts
      tags:
        - Contacts
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The user's contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContactResponse'
        '403':
          description: Forbidden
        '404':
          description: No such user
    post:
      summary: Add an email or phone
      description: |
        Created as MANUAL/PENDING and active. Self-or-ADMINISTRATOR. Values are immutable;
        to change a contact, disable the current one (via /state) and add a new one.
      tags:
        - Contacts
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreateRequest'
      responses:
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '400':
          description: Invalid body
        '403':
          description: Forbidden
        '404':
          description: No such user
        '409':
          description: An active contact of that type already exists for the user

  /api/v1/users/{userId}/contacts/{id}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a contact
      tags:
        - Contacts
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '403':
          description: Forbidden
        '404':
          description: No such contact

  /api/v1/users/{userId}/contacts/{id}/state:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Enable or disable a contact
      description: |
        Contact values are immutable — instead of editing, disable a contact and add a new
        one. Self-or-ADMINISTRATOR. Re-enabling a contact while another of the same type is
        already active is a conflict.
      tags:
        - Contacts
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactStateRequest'
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '400':
          description: Invalid body or malformed id
        '403':
          description: Forbidden
        '404':
          description: No such contact
        '409':
          description: Another active contact of that type already exists

  /api/v1/users/{userId}/contacts/{id}/verification:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Set a contact's verification state (ADMINISTRATOR only)
      description: |
        Manual stand-in for automated OTP. Only an ADMINISTRATOR may call this. A VERIFIED
        status stamps verifiedAt/verifiedBy and the method (default ADMIN_OVERRIDE); any
        other status clears those audit fields.
      tags:
        - Contacts
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '400':
          description: Invalid body
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such contact
        '409':
          description: This value is already verified for another account

  /api/v1/users/{userId}/names:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List a user's names
      tags:
        - Names
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The user's names (incl. disabled history)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NameResponse'
        '403':
          description: Forbidden
        '404':
          description: No such user
    post:
      summary: Add a name
      description: |
        Append-only. Self-or-ADMINISTRATOR. The single-valued types (DISPLAY, FIRST, LAST) keep
        exactly one active value — adding a new one supersedes the prior active of that type (the
        old becomes disabled history). Other types may have multiple active names. Values are
        immutable; to change those, disable (via /state) and add a new one. FIRST/LAST are private
        — they never appear on the public profile.
      tags:
        - Names
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameCreateRequest'
      responses:
        '201':
          description: Name created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameResponse'
        '400':
          description: Invalid body
        '403':
          description: Forbidden
        '404':
          description: No such user

  /api/v1/users/{userId}/names/{id}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a name
      tags:
        - Names
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameResponse'
        '403':
          description: Forbidden
        '404':
          description: No such name

  /api/v1/users/{userId}/names/{id}/state:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Enable or disable a name
      description: |
        Name values are immutable — instead of editing, disable a name and add a new one.
        Self-or-ADMINISTRATOR. The display name cannot be disabled (replace it by posting a
        new DISPLAY name); re-enabling a former display name conflicts with the current one.
      tags:
        - Names
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameStateRequest'
      responses:
        '200':
          description: Updated name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameResponse'
        '400':
          description: Invalid body, malformed id, or attempting to disable the display name
        '403':
          description: Forbidden
        '404':
          description: No such name
        '409':
          description: Re-enabling a former display name conflicts with the current one

  /api/v1/users/{userId}/capabilities:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List a user's capabilities (ADMINISTRATOR only)
      description: Includes revoked history. The whole capability API is admin-only.
      tags:
        - Capabilities
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The user's capability grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapabilityResponse'
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such user
    post:
      summary: Grant a capability (ADMINISTRATOR only)
      description: Idempotent — 201 when newly granted, 200 if already held. Records granted_by.
      tags:
        - Capabilities
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityGrantRequest'
      responses:
        '201':
          description: Capability granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityResponse'
        '200':
          description: Capability already held (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityResponse'
        '400':
          description: Invalid capability
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such user

  /api/v1/users/{userId}/capabilities/{capability}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: capability
        in: path
        required: true
        schema:
          type: string
          enum: [PLAYER, HOST, CLUB_OWNER, ADMINISTRATOR, RATER, RESEARCHER, POINTS_MANAGER]
    delete:
      summary: Revoke a capability (ADMINISTRATOR only)
      description: |
        Disables the active grant (kept as history). Guardrails: PLAYER cannot be revoked; the
        last ADMINISTRATOR cannot be revoked; an admin cannot revoke their own ADMINISTRATOR
        while others remain.
      tags:
        - Capabilities
      security:
        - firebaseAuth: []
      responses:
        '204':
          description: Capability revoked
        '403':
          description: Caller is not an ADMINISTRATOR, or revoking own ADMINISTRATOR
        '404':
          description: No such user, or the capability is not currently held
        '409':
          description: Revoking PLAYER or the last ADMINISTRATOR

  /api/v1/ratings/calculations:
    post:
      summary: Trigger the rating calculation (ADMINISTRATOR only)
      description: |
        Processes matches pending calculation oldest→newest, carrying ratings forward. dryRun
        defaults to true (an empty body is a dry run) and previews with no writes; an explicit
        false commits ratings, history, and rated_at.

        eventIds optionally scopes the run to a selection of finalized events (#479). When omitted or
        empty, every pending match is processed (unchanged). When provided, only those events' pending
        matches are previewed/committed — but ratings must carry forward on a consistent timeline, so
        the selection must form a contiguous prefix of the pending timeline: you may not select an
        event while an older pending match (an earlier event, or an eventless "Open" match) is left
        out. A selection that skips an earlier pending match is rejected with 400 (Validation error),
        naming the earliest excluded match. The same guard applies to both preview and commit.
      tags:
        - Ratings
      security:
        - firebaseAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationRequest'
      responses:
        '200':
          description: The calculation outcome (preview or committed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResponse'
        '403':
          description: Caller is not an ADMINISTRATOR

  /api/v1/users/pending-assessment:
    get:
      summary: List users pending an initial rating, paged (RATER or ADMINISTRATOR)
      tags:
        - Ratings
      security:
        - firebaseAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Page size (clamped to 1..100).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Number of rows to skip (clamped to >= 0).
      responses:
        '200':
          description: A page of active users with no rating on record, plus the total count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingAssessmentPageResponse'
        '403':
          description: Caller is not an ADMINISTRATOR

  /api/v1/users/{userId}/ratings:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a user's current ratings
      description: Self-or-ADMINISTRATOR. Returns the user's NTRP rating.
      tags:
        - Ratings
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The user's ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRatingResponse'
        '403':
          description: Forbidden
        '404':
          description: No such user
    put:
      summary: Set or adjust a user's rating (RATER or ADMINISTRATOR)
      description: |
        The initial assessment, or a later adjustment. Validates the NTRP range
        (1.0–7.0) and derives the published level.
      tags:
        - Ratings
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRatingRequest'
      responses:
        '200':
          description: The updated rating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRatingResponse'
        '400':
          description: Invalid rating value/confidence
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such user

  /api/v1/users/{userId}/rating-history:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a user's rating history
      description: Self-or-ADMINISTRATOR.
      tags:
        - Ratings
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: Rating-change history (most recent first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RatingHistoryResponse'
        '403':
          description: Forbidden
        '404':
          description: No such user

  /api/v1/matches:
    get:
      summary: List match fixtures by oversight view (HOST/ADMINISTRATOR)
      description: |
        An ADMINISTRATOR sees every match in the view; a HOST sees only the fixtures
        they created (so they can find their own matches awaiting results).
      tags:
        - Matches
      security:
        - firebaseAuth: []
      parameters:
        - name: filter
          in: query
          required: true
          schema:
            type: string
            enum: [pending-calculation, awaiting-results, results]
          description: >
            pending-calculation = completed & unrated; awaiting-results = scheduled, any match date;
            results = an event's completed fixtures (rated or not), event-scoped via eventId (#138).
        - name: eventId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Scope awaiting-results to a single event's fixtures (#138).
      responses:
        '200':
          description: Matching fixtures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchResponse'
        '400':
          description: Missing or invalid filter
        '403':
          description: Caller is not an ADMINISTRATOR
    post:
      summary: Create a match fixture (staff; an event's fixtures follow its club rule)
      description: >-
        Scheduled fixture, no results. Every participant must already be rated. When the fixture belongs
        to an event it inherits that event's club rule (#789): only an ADMINISTRATOR, a named owner of the
        event's club, or the event's creator may add fixtures to it. The event-expiry gate (#310) is a
        separate axis and also applies.
      tags:
        - Matches
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFixtureRequest'
      responses:
        '201':
          description: Fixture created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '400':
          description: Invalid input (bad ids/date, unrated participant, bad composition)
        '403':
          description: >-
            Caller is not staff, or — for a fixture that belongs to an event — may not organize that
            event (#789): not an ADMINISTRATOR, not a named owner of the event's club, and not the
            event's creator. A fixture with no event keeps the plain staff gate.

  /api/v1/matches/upcoming:
    get:
      summary: The caller's own upcoming (scheduled) matches (#251)
      description: >-
        The authenticated caller's SCHEDULED fixtures dated today or later, soonest first, for the
        private profile. Owner-only (derived from the token); an unprovisioned caller gets an empty list.
      tags:
        - Matches
