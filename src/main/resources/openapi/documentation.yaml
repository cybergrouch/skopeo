              schema:
                $ref: '#/components/schemas/EventResponse'
        '403':
          description: Caller is not staff, or may not organize this event (#789)
        '404':
          description: No event with that code

  /api/v1/events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get an event with its participants (staff, scoped to the clubs the caller owns)
      tags:
        - Events
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '403':
          description: Caller is not staff, or may not organize this event (#789)
        '404':
          description: No such event
    patch:
      summary: Rename an event (staff, scoped to the clubs the caller owns)
      description: |
        Partial update of an event (#269). Currently only the name is editable; the name is
        validated (non-blank) and trimmed. A HOST may rename only their own event; an ADMINISTRATOR
        may rename any.
      tags:
        - Events
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: The updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Missing or blank name
        '403':
          description: Caller is not staff, or may not organize this event (not an ADMINISTRATOR, not a named owner of its club, not its creator — #789)
        '404':
          description: No such event
    delete:
      summary: Delete an event (staff, scoped to the clubs the caller owns)
      description: |
        Soft-deletes an event, gated by its matches. Any rated match blocks deletion outright; any
        recorded (but unrated) match is refused with advice to delete those matches first. Remaining
        scheduled fixtures are soft-disabled alongside the event. A HOST may delete only their own event.
      tags:
        - Events
      security:
        - firebaseAuth: []
      responses:
        '204':
          description: Event deleted
        '403':
          description: Caller is not staff, or may not organize this event (#789)
        '404':
          description: No such event
        '409':
          description: The event has recorded or rated matches and cannot be deleted

  /api/v1/events/{id}/club:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Re-file an event under a different club
      description: >-
        RE-FILE the event under a different club (#319) — since #794 the club cannot be cleared, because
        every event belongs to one. Staff-only, scoped by club ownership (#789): the caller must own both
        the event's current club and the destination, or be an ADMINISTRATOR. The club must exist.

        An ADMINISTRATOR may also change the club of an ALREADY-FINALIZED event (#782), unlike every
        other finalized-event edit. Which club an event is filed under is not an input to the rating
        calculation, so re-filing one cannot invalidate a rating or history row and nothing is
        recalculated; the event stays finalized and its matches stay rated. A HOST or CLUB_OWNER is
        still refused on a finalized event (409). One consequence is deliberately NOT unwound: a
        finalized TOURNAMENT that opted into points already paid its placement schedule under the
        previous club's `tournamentsSanctioned` flag, and those awards are left as issued — the audit
        entry records this via `placementPointsLeftAsIssued`.
      tags:
        - Events
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEventClubRequest'
      responses:
        '200':
          description: The updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Malformed id or unknown club
        '403':
          description: Caller is not staff, may not organize this event, or does not own the club it is being re-filed under (#789)
        '404':
          description: No such event

  /api/v1/events/{id}/calculation-priority:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Set an event's rating-calculation processing priority
      description: >-
        ADMINISTRATOR only (#335). Sets the event's processing order for the rating calculation
        (Pending Calculation groups by event); persisted on the same scale as the event's end date so
        a dragged event slots between date-ordered neighbours.
      tags:
        - Events
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCalcPriorityRequest'
      responses:
        '200':
          description: The updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Malformed id or body
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such event

  /api/v1/events/{id}/finalize:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Finalize an event (staff, scoped to the clubs the caller owns)
      description: >-
        Finalize an event (#403) — terminal: it closes the event to further changes and queues the
        event's matches for rating (moving the rating-queue trigger from result-upload time to finalize
        time; event-less matches keep queuing immediately). A HOST may finalize only their own event; an
        ADMINISTRATOR or CLUB_OWNER any. There is no un-finalize in Phase A.


        Awarding: when the global "Award ranking points" flag (#641) is off, finalizing awards nothing
        even for an event whose own awardRankingPoints is true — the flag is a kill switch (#752). That
        case is reported as awardingSuppressedByGlobalFlag on the response, so a caller never reads a
        successful finalize as "points were paid".
      tags:
        - Events
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The finalized event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Event is already finalized, or a deleted event
        '403':
          description: Caller is not staff, or may not organize this event (#789)
        '404':
          description: No such event

  /api/v1/events/{id}/unfinalize:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Un-finalize an event (staff, scoped to the clubs the caller owns)
      description: >-
        Un-finalize an event (#477) — the reverse of finalize, so an erroneous score can be corrected and
        the event re-finalized. Clears the finalize flag and revokes every active ranking-point award the
        finalize produced (append-only: revocation markers are added, nothing is deleted). A HOST may
        un-finalize only their own event; an ADMINISTRATOR
        or CLUB_OWNER any. Refused if the event is not finalized, or if any of its matches are already
        rated (the bad score is already in rating history — a heavier correction path is required).
        Audited as EVENT_UNFINALIZED.
      tags:
        - Events
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The un-finalized event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Event is not finalized, or has already-rated matches
        '403':
          description: Caller is not staff, or may not organize this event (#789)
        '404':
          description: No such event

  /api/v1/events/{id}/reverse-ratings:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Reverse an already-rated event's ratings (ADMINISTRATOR only)
      description: >-
        Reverse an already-rated event's ratings (#478) — the rated-path complement of un-finalize, which
        refuses once any of the event's matches are rated. In one transaction it restores each participant
        to their pre-event rating (from user_rating_history.previous_rating), supersedes (soft-deletes) the
        event's rating-history rows, revokes its active ranking-point awards, resets rated_at on its matches
        (re-queuing them for calculation), and clears the finalize flag so the score can be corrected and
        the event re-finalized. Destructive and ADMINISTRATOR-only. Refused unless the event is finalized,
        has at least one rated match, and is at the rated tip — no participant has a rated match dated after
        their in-event match(es); a not-at-tip event is refused because reversing it alone would leave the
        later ratings stale. Audited as EVENT_RATINGS_REVERSED.
      tags:
        - Events
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The reversed (re-openable) event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Event is not finalized, has no rated matches, or is not at the rated tip
