          type: string
        publicCode:
          type: string
          description: The shareable code for the club's public-by-code page (#327).
        isActive:
          type: boolean
        tournamentsSanctioned:
          type: boolean
          description: Whether this club's tournaments are sanctioned (#525); a tournament inherits this.
        owners:
          type: array
          items:
            type: object
            required:
              - userId
              - publicCode
            properties:
              userId:
                type: string
                format: uuid
              displayName:
                type: string
                nullable: true
              publicCode:
                type: string

    ClubPublicResponse:
      type: object
      description: >-
        Read-only public summary of a club (#327) — just the club itself. Its events moved to the
        separately-paginated GET /clubs/code/{code}/events (#786), so rendering the page header no longer
        costs a scan of everything the club has ever run. No owner or roster PII is exposed.
      required:
        - publicCode
        - name
      properties:
        publicCode:
          type: string
        name:
          type: string
        isActive:
          type: boolean
          description: False once the club is soft-deleted (#325); the public page flags it as deleted.

    ClubPublicEventsResponse:
      type: object
      description: >-
        One page of a club's events in a single bucket (#786). `total` is the size of the whole bucket,
        not of the page, so a pager can render "Showing 1–10 of 37".
      required:
        - bucket
        - items
        - total
      properties:
        bucket:
          type: string
          enum: [UPCOMING, UNFINALIZED, FINALIZED]
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClubPublicEventResponse'
        total:
          type: integer
          format: int64

    ClubPublicEventResponse:
      type: object
      description: >-
        One of a club's events on its public page (#327) — shareable code, name, date range, and type.
      required:
        - publicCode
        - name
        - startDate
        - endDate
        - eventType
      properties:
        publicCode:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        eventType:
          type: string
          enum: [OPEN_PLAY, TOURNAMENT]
        isFinalized:
          type: boolean
          description: >-
            True once the event is finalized (#403). The first input to the client's Upcoming /
            Unfinalized / Finalized split (#780) — finalized wins over dates and results.
        finalizedAt:
          type: string
          nullable: true
          description: When the event was finalized; the Finalized group's newest-first sort key.
        completedMatchCount:
          type: integer
          description: >-
            Recorded results in this event (#483) — the "activity started" signal that separates
            Unfinalized from Upcoming.

