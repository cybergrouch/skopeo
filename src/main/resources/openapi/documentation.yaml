        '401':
          description: Missing or invalid Firebase token
        '403':
          description: The token maps to no provisioned user

  /api/v1/users/me/rating-preview:
    put:
      summary: Set the caller's raw-rating preview toggle (#583)
      description: >-
        Per-admin "preview as non-admin" toggle (#583). ADMINISTRATOR-only. When true, this admin sees
        the non-admin view of ratings on LIVE — band + confidence + speedometer only, no raw NTRP value,
        band-jump-only rating history, and no access to the calculation breakdown — without affecting any
        other user. Default false = the admin sees raw values normally. Self-service (id from the token).
      tags:
        - Settings
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRatingPreviewRequest'
      responses:
        '200':
          description: The updated preview toggle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingPreviewResponse'
        '401':
          description: Missing or invalid Firebase token
        '403':
          description: Caller is not an ADMINISTRATOR

  /api/v1/settings/standings-source:
    get:
      summary: Get the standings serving source (#146)
      description: >-
        Which snapshot source the Standings tab serves (RATING or POINTS). Readable so the Admin tab can
        show the current value; defaults to RATING when unset.
      tags:
        - Settings
      security:
        - firebaseAuth: []
        - {}
      responses:
        '200':
          description: The current standings serving source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingsSourceResponse'
    put:
      summary: Set the standings serving source (#146)
      description: ADMINISTRATOR only. Flips the served source between RATING and POINTS; the write is audit-logged.
      tags:
        - Settings
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetStandingsSourceRequest'
      responses:
        '200':
          description: The updated standings serving source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingsSourceResponse'
        '400':
          description: Unknown standings source value
        '401':
          description: Missing or invalid Firebase token
        '403':
          description: Caller is not an ADMINISTRATOR

  /api/v1/settings/facebook-login:
    get:
      summary: Get the Facebook-login feature flag (#647)
      description: >-
        Whether the "Continue with Facebook" sign-in/sign-up buttons are shown. Publicly readable so the
        unauthenticated login/sign-up pages can decide whether to render them; defaults to enabled when unset.
      tags:
        - Settings
      security:
        - firebaseAuth: []
        - {}
      responses:
        '200':
          description: The current Facebook-login flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookLoginResponse'
    put:
      summary: Set the Facebook-login feature flag (#647)
      description: ADMINISTRATOR only. Enables or disables the Facebook sign-in buttons app-wide; the write is audit-logged.
      tags:
        - Settings
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFacebookLoginRequest'
      responses:
        '200':
          description: The updated Facebook-login flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookLoginResponse'
        '401':
          description: Missing or invalid Firebase token
        '403':
          description: Caller is not an ADMINISTRATOR

  /api/v1/settings/award-ranking-points:
    get:
      summary: Get the award-ranking-points feature flag (#641)
      description: >-
        Whether ranking-point awarding is enabled app-wide. Defaults to disabled when unset, so nothing
        awards until an admin enables it. This is a server-enforced kill switch, not just a UI toggle
        (#752): while it is off, an event-create request opting into awarding is coerced to
        awardRankingPoints=false, and finalizing an event whose own flag is set awards nothing.
      tags:
        - Settings
      security:
        - firebaseAuth: []
        - {}
      responses:
        '200':
          description: The current award-ranking-points flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwardRankingPointsResponse'
    put:
      summary: Set the award-ranking-points feature flag (#641)
      description: >-
        ADMINISTRATOR only. Enables or disables ranking-point awarding app-wide; the write is audit-logged.
        Turning it off takes effect immediately for events that have not yet been finalized (#752).
      tags:
        - Settings
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAwardRankingPointsRequest'
      responses:
        '200':
          description: The updated award-ranking-points flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwardRankingPointsResponse'
        '401':
          description: Missing or invalid Firebase token
        '403':
          description: Caller is not an ADMINISTRATOR

  /api/v1/settings/points/open-play:
    get:
      summary: Get the open-play points schedule (#553)
      description: >-
        The admin-configurable open-play margin-bracket point table (winner/loser per band relation ×
        game margin) and its validity window. Readable by any signed-in user (the Admin tab loads it);
        falls back to the seeded default when unset.
      tags:
        - Settings
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The current open-play points schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenPlayConfigResponse'
    put:
      summary: Set the open-play points schedule (#553)
      description: ADMINISTRATOR only. Replaces the open-play margin-bracket schedule; the write is audit-logged.
      tags:
        - Settings
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenPlayPointsConfig'
      responses:
        '200':
          description: The updated open-play points schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenPlayConfigResponse'
        '400':
          description: Invalid schedule
        '403':
          description: Caller is not an ADMINISTRATOR

  /api/v1/settings/points/tournament:
    get:
      summary: Get the tournament placement points schedule (#552)
      description: >-
        The admin-configurable tournament placement points (sanctioned + unsanctioned, 1st..4th) and
        validity window. Readable by any signed-in user; falls back to the seeded default when unset.
      tags:
        - Settings
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The current tournament placement points schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentConfigResponse'
    put:
      summary: Set the tournament placement points schedule (#552)
      description: ADMINISTRATOR only. Replaces the tournament placement schedule; the write is audit-logged.
      tags:
        - Settings
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentPointsConfig'
      responses:
        '200':
          description: The updated tournament placement points schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentConfigResponse'
        '400':
          description: Invalid schedule
        '403':
          description: Caller is not an ADMINISTRATOR

  /api/v1/invites:
    post:
      summary: Invite an email to onboard (ADMINISTRATOR only)
      description: >-
        Records an onboarding invite for an email. Re-inviting a still-pending email rotates its
        7-day expiry (the "resend" affordance). The email-link itself is sent client-side via
        Firebase; this only records the invite the provisioning gate checks.
      tags:
        - Invites
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Invite created (or the pending one rotated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'
        '400':
          description: Invalid email
        '403':
          description: Caller is not an ADMINISTRATOR
        '409':
          description: An account already exists with this email (active account)
    get:
      summary: List invites, paged (ADMINISTRATOR only)
      tags:
        - Invites
      security:
        - firebaseAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Page size (clamped to 1..100).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Number of rows to skip (clamped to >= 0).
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, ACCEPTED, REVOKED]
          description: >-
            Filter to a single stored status. EXPIRED is not stored (it is a derived view of
            PENDING past its expiry), so use PENDING to scope to actionable invites. Omit for all.
      responses:
        '200':
          description: A page of invites plus the total count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePageResponse'
        '403':
          description: Caller is not an ADMINISTRATOR

  /api/v1/invites/{id}:
    delete:
      summary: Revoke an invite (ADMINISTRATOR only)
      tags:
        - Invites
      security:
        - firebaseAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invite revoked
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such invite

  /api/v1/audit:
    get:
      summary: Read the audit log, newest first (ADMINISTRATOR only)
      description: >-
        The admin trace viewer (#102). Returns provenance entries newest-first, optionally scoped
        to a category, with actor (and user-typed target) ids resolved to display name + player
        code, and `occurredAt` as a UTC instant for the client to render in the viewer's timezone.
      tags:
        - Audit
      security:
        - firebaseAuth: []
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum:
              - USER_CREATION
              - NAME_CHANGE
              - CONTACT_CHANGE
              - INVITE
              - MATCH_FIXTURE
              - MATCH_RESULT
              - CAPABILITY_CHANGE
              - RATING_CHANGE
              - RATING_CALCULATION
              - DUPLICATE_RECTIFICATION
              - CLUB_MANAGEMENT
              - EVENT_MANAGEMENT
          description: Scope to a single category; omit for all.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
          description: Page size (clamped to 1..100).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Rows to skip (clamped to >= 0).
      responses:
        '200':
          description: A page of audit entries plus the total count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'
        '400':
          description: Unknown category
        '403':
          description: Caller is not an ADMINISTRATOR

  /api/v1/reports/band-hops:
    get:
      summary: NTRP band-hop report over a date range (ADMINISTRATOR only)
      description: >-
        For each rated player (#216/#724), reports two band-movement metrics against the band they were in
        entering the window: the EXCURSION (vs the farthest band reached in-window, so a transient crossing
        counts, #289) and the NET (vs the window's closing band, so a round-tripper reads 0, #724). Players
        are bucketed by the absolute number of 0.5-wide bands moved under each metric (0 = stayed in band).
        Confirms that most players stay in band and surfaces the exceptions who jumped. Band labels only —
        never exact ratings.
      tags:
        - Reports
      security:
        - firebaseAuth: []
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Window start (inclusive), ISO-8601 yyyy-MM-dd.
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Window end (inclusive), ISO-8601 yyyy-MM-dd.
      responses:
        '200':
          description: The band-hop report for the range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BandHopReportResponse'
        '400':
          description: Missing/invalid date, or endDate before startDate
        '403':
          description: Caller is not an ADMINISTRATOR

  /api/v1/audit/{id}/comment:
    patch:
      summary: Set or clear an administrator's note on an audit entry (ADMINISTRATOR only)
      description: The one mutable, un-audited field on an entry (#100). A blank comment clears it.
      tags:
        - Audit
      security:
        - firebaseAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditCommentRequest'
      responses:
        '204':
          description: Comment set or cleared
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such audit entry

  /api/v1/duplicate-candidates:
    get:
      summary: List duplicate candidates for review (#126)
      description: ADMINISTRATOR only. Suspected same-person account pairs, newest first.
      tags:
        - Duplicates
      security:
        - firebaseAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, DISMISSED, RESOLVED]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: A page of duplicate candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCandidatePageResponse'
        '403':
          description: Caller is not an ADMINISTRATOR
    post:
      summary: Manually flag a duplicate candidate (#126)
      description: ADMINISTRATOR only. Flags a suspected pair (the "complaint" signal).
      tags:
        - Duplicates
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagCandidateRequest'
      responses:
        '201':
          description: The flagged candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCandidateResponse'
        '400':
          description: Same user twice or a malformed id
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such user

  /api/v1/duplicate-candidates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Dismiss a duplicate candidate (#126)
      description: ADMINISTRATOR only. Marks an open candidate DISMISSED (a false positive).
      tags:
        - Duplicates
      security:
        - firebaseAuth: []
      responses:
        '204':
          description: Candidate dismissed
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such candidate
        '409':
          description: Candidate is not open

  /api/v1/duplicate-candidates/{id}/confirm:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Confirm a duplicate candidate (#126)
      description: ADMINISTRATOR only. Marks the non-canonical account a duplicate (via #124) and resolves the candidate.
      tags:
        - Duplicates
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmCandidateRequest'
      responses:
        '204':
          description: Candidate confirmed and resolved
        '400':
          description: canonicalId is not one of the candidate's accounts
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such candidate
        '409':
          description: Candidate is not open

  /api/v1/player-lists:
    get:
      summary: List the caller's player lists (#111)
      description: HOST/CLUB_OWNER/ADMINISTRATOR only. The caller's own named lists, newest first.
      tags:
        - Player Lists
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The caller's lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerListSummaryResponse'
        '403':
          description: Caller cannot manage seeding lists
    post:
      summary: Create a named player list (#111)
      tags:
        - Player Lists
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerListRequest'
      responses:
        '201':
          description: The created list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerListSummaryResponse'
        '400':
          description: Missing list name
        '403':
          description: Caller cannot manage seeding lists

  /api/v1/player-lists/{id}:
    get:
      summary: Get a list with its members (#111)
      tags:
        - Player Lists
      security:
        - firebaseAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The list and its members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerListResponse'
        '403':
          description: Not the caller's list
        '404':
          description: No such list
    delete:
      summary: Delete a list (#111)
      tags:
        - Player Lists
      security:
        - firebaseAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '403':
          description: Not the caller's list
        '404':
          description: No such list

  /api/v1/player-lists/{id}/members:
    post:
      summary: Add a player to a list (#111)
      description: The target must have the PLAYER capability.
      tags:
        - Player Lists
      security:
        - firebaseAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '204':
          description: Member added
        '400':
          description: Target is not a player, or a malformed id
        '403':
          description: Not the caller's list
        '404':
          description: No such list or user
        '409':
          description: Already a member

  /api/v1/player-lists/{id}/members/{userId}:
    delete:
      summary: Remove a player from a list (#111)
      tags:
        - Player Lists
      security:
        - firebaseAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Member removed
        '403':
          description: Not the caller's list
        '404':
          description: Not a member

  /api/v1/player-lists/{id}/seeding:
    post:
      summary: Generate (or regenerate) a list's seeding (#111)
      description: >-
        Rating-sorted (highest first); the top ⌈N/2⌉ rated members get bracket seeds. Regenerating
        overwrites the previous seeding.
      tags:
        - Player Lists
      security:
        - firebaseAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The generated seeding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedingResponse'
        '403':
          description: Not the caller's list
        '404':
          description: No such list
    put:
      summary: Save a hand-reordered list seeding (#718)
      description: >-
        Persist the host's manual drag-and-drop order for the list's seeding. The request lists the
        seedable members' user ids in the desired order; seeds are renumbered 1..N by the new position
        (reordering reassigns seed numbers) and the seeding is marked manually edited. The ids must be
        exactly the current seedable set (a permutation) — no additions or removals.
      tags:
        - Player Lists
      security:
        - firebaseAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSeedingOrderRequest'
      responses:
        '200':
          description: The saved, renumbered seeding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedingResponse'
        '400':
          description: The order is not exactly the current seedable set
        '403':
          description: Not the caller's list
        '404':
          description: No such list
    get:
      summary: Get the current seeding for a list (#111)
      tags:
        - Player Lists
      security:
        - firebaseAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The current seeding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedingResponse'
        '403':
          description: Not the caller's list
        '404':
          description: No seeding generated yet

  /api/v1/standings:
    get:
      summary: One page of the per-band standings (#113, #220)
      description: >-
        Interim, ratings-derived standings served from a persisted, published snapshot (#220). Returns
        one (band, sex) page ordered by rank, the group's total, and the (band, sex) selectors on offer.
        Readable by any signed-in player; the exact rating is returned only to RATER/ADMINISTRATOR
        viewers (#186). Omitting `band` defaults to the strongest available group (Men first). The
        snapshot is source-agnostic — points replace rating as the ordering source under #146 without
        changing this read path.
      tags:
        - Standings
      security:
        - firebaseAuth: []
      parameters:
        - name: band
          in: query
          required: false
          schema:
            type: string
          description: >-
            Band code to view (e.g. "4.0", "<3.0", "6.0+"); one of the codes listed in the response
            `groups`. Defaults to the strongest available band when omitted.
        - name: sex
          in: query
          required: false
          schema:
            type: string
          description: The group's sex ("Male"/"Female"); omit for the Unspecified group (#212).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
          description: Page size (default 25, capped at 100).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Zero-based row offset within the (band, sex) group.
      responses:
        '200':
          description: One page of the selected (band, sex) group plus totals and selectors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingsPageResponse'
  /api/v1/standings/me:
    get:
      summary: Locate the caller in the standings (jump-to-me, #220)
      description: >-
        Where the caller sits in the latest published snapshot — their (band, sex, rank) — plus the
        page offset (with the limit used) that contains their row, so the client can load exactly that
        page. 404 when the caller isn't in the current standings (e.g. unrated).
      tags:
        - Standings
      security:
        - firebaseAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
          description: Page size used to compute the containing page offset (default 25, capped at 100).
      responses:
        '200':
          description: The caller's location and the containing page offset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingsLocateResponse'
        '404':
          description: The caller is not in the current standings

  /api/v1/standings/calculations:
    post:
      summary: Recompute the points-based standings (ADMINISTRATOR only, #146 phase 2)
      description: >-
        Rebuilds the standings snapshot from the ranking-points ledger (not ratings). It sums each
        active player's counting awards (ACTIVE and in their validity window as of now) per (band, sex)
        using the award's own band + sex tags (band-tagged, decision D2) and ranks each group by points
        descending, tie-broken by higher current rating then name. dryRun defaults to true (an empty
        body is a dry run) and previews with no writes; an explicit false publishes a POINTS snapshot,
        after which reads automatically prefer points over rating-derived standings. Scheduling is #389
        and tournament auto-awards are #390 — both out of scope here (this is the manual trigger).
      tags:
        - Standings
      security:
        - firebaseAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandingsCalculationRequest'
      responses:
        '200':
          description: The recompute outcome (preview or committed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingsCalculationResponse'
        '403':
          description: Caller is not an ADMINISTRATOR

  /api/v1/users/{userId}/ranking-points:
    post:
      summary: Grant a ranking-point award (#146)
      description: >-
        Admin-only. Append a ranking-point award to the user's ledger. The award is band-tagged at
        award time (band defaults to the target's current NTRP band, overridable) and sex-tagged from
        the target. Validity defaults from the point-class policy and is overridable. An external /
        ad-hoc grant (sourceType EXTERNAL) requires a reason for traceability.
      tags:
        - Ranking Points
      security:
        - firebaseAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRankingPointsRequest'
      responses:
        '201':
          description: The created award
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingPointAwardResponse'
        '400':
          description: Validation error (non-positive points, missing reason, unknown class, bad band)
        '403':
          description: Not an administrator
    get:
      summary: List a user's ranking-point awards (#146)
      description: Admin-only. Every ledger row for the user, newest first (including REVOKED markers).
      tags:
        - Ranking Points
      security:
        - firebaseAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The user's ledger rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankingPointAwardResponse'
        '403':
          description: Not an administrator
        '404':
          description: No such user

  /api/v1/users/{userId}/ranking-points/adjustments:
    post:
      summary: Manually award or deduct ranking points (#469)
      description: >-
        Admin-only. Append a signed manual adjustment to the user's ledger from the Manage Player
        section: positive points award, negative points deduct (non-zero, whole). It is a non-budgeted
        EXTERNAL entry with a mandatory reason and an explicit validity window, band-tagged from the
        player's current NTRP band and sex-tagged from the player. Queued like a match award: it shows
        immediately in the player's points audit but only affects the standings on the next points
        calculation. A net-negative counted total is floored at 0 in the standings (the ledger stays signed).
      tags:
        - Ranking Points
      security:
        - firebaseAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustRankingPointsRequest'
      responses:
        '201':
          description: The created adjustment (a ledger row)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingPointAwardResponse'
        '400':
          description: Validation error (zero or fractional points, blank reason, end before start, unrated player)
        '403':
          description: Not an administrator

  /api/v1/ranking-points:
    get:
      summary: List all ranking-point awards, paginated (#472)
      description: >-
        The Points Management "Points awarded" list: one page of the whole ledger, newest-first by
        awarded_at (including REVOKED markers). Gated to POINTS_MANAGER or ADMINISTRATOR (matching the
        Points Management tab). Each row is enriched with the player's display name + public code and
        the granting source's public code (match, else event; else "manual"/"EXTERNAL").
      tags:
        - Ranking Points
      security:
        - firebaseAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size (default 25, clamped to 1..100).
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          description: Zero-based row offset (default 0).
          schema:
            type: integer
      responses:
        '200':
          description: One page of awarded points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwardedPointsPageResponse'
        '403':
          description: Not a points manager or administrator

  /api/v1/ranking-points/{awardId}/revoke:
    post:
      summary: Revoke a ranking-point award (#146)
      description: >-
        Admin-only. Flip the original award to REVOKED and append a REVOKED marker row referencing it,
        keeping the ledger append-only. Idempotent: revoking an already-revoked or missing award is a 404.
      tags:
        - Ranking Points
      security:
        - firebaseAuth: []
      parameters:
        - name: awardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRankingPointsRequest'
      responses:
        '204':
          description: Revoked
        '403':
          description: Not an administrator
        '404':
          description: No active award with that id

  /api/v1/api-clients:
    post:
      summary: Register a partner API client
      description: ADMINISTRATOR only (#596). Registers a partner application that can be issued API keys.
      tags:
        - Client API
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiClientRequest'
      responses:
        '201':
          description: The created client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiClientResponse'
        '400':
          description: Invalid body (e.g. blank name)
        '403':
          description: Caller is not an ADMINISTRATOR
    get:
      summary: List partner API clients
      description: ADMINISTRATOR only (#596). Lists partner clients with their keys (never the plaintext secret).
      tags:
        - Client API
      security:
        - firebaseAuth: []
      responses:
        '200':
          description: The clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiClientResponse'
        '403':
          description: Caller is not an ADMINISTRATOR

  /api/v1/api-clients/{id}/rate-limit:
    put:
      summary: Set a client's rate-limit override
      description: ADMINISTRATOR only (#603). Sets a per-minute limit for the client; a null value clears it (use the default tier).
      tags:
        - Client API
      security:
        - firebaseAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRateLimitRequest'
      responses:
        '200':
          description: The updated client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiClientResponse'
        '400':
          description: Invalid limit (must be positive)
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such client

  /api/v1/api-clients/{id}/keys:
    post:
      summary: Issue an API key
      description: ADMINISTRATOR only (#596). Issues a key for the client; the plaintext secret is returned once and never again.
      tags:
        - Client API
      security:
        - firebaseAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueApiKeyRequest'
      responses:
        '201':
          description: The issued key, including its one-time plaintext secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedApiKeyResponse'
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such client

  /api/v1/api-clients/{clientId}/keys/{keyId}:
    delete:
      summary: Revoke an API key
      description: ADMINISTRATOR only (#596). Revokes an active key belonging to the client.
      tags:
        - Client API
      security:
        - firebaseAuth: []
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No active key with that id for the client

  /api/v1/client/me:
    get:
      summary: Resolve the calling API key
      description: Machine-to-machine (#596). Returns the client identity and scopes behind the X-Api-Key.
      tags:
        - Client API
      security:
        - apiKey: []
      responses:
        '200':
          description: The resolved client identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientIdentityResponse'
        '401':
          description: Missing or invalid API key
        '403':
          description: The key is revoked or expired, or its client is suspended

  /api/v1/client/players:
    get:
      summary: Partner player directory
      description: Machine-to-machine (#597), requires the RESEARCHER scope. A public directory of players (public code and display name only).
      tags:
        - Client API
      security:
        - apiKey: []
      responses:
        '200':
          description: The player directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerPlayerResponse'
        '401':
          description: Missing or invalid API key
        '403':
          description: The key is not scoped for RESEARCHER

  /api/v1/client/me/capabilities:
    get:
      summary: Effective capabilities for a delegated call
      description: Delegated (#597), requires BOTH a Firebase user token and an X-Api-Key. Returns the intersection of the key's scopes and the user's capabilities.
      tags:
        - Client API
      security:
        - firebaseAuth: []
          apiKey: []
      responses:
        '200':
          description: The effective (intersected) capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientEffectiveCapabilitiesResponse'
        '401':
          description: Missing user token or API key

components:
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase-issued ID token (RS256), verified against Google's public keys.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: A partner client's API key (#596), sent in the X-Api-Key header.
  schemas:
    CreateApiClientRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    IssueApiKeyRequest:
      type: object
      properties:
        scopes:
          type: array
          items:
            type: string
          description: Capability names the key is authorized for (least privilege).
        environment:
          type: string
          description: LIVE (default) or TEST; selects the key prefix.
        expiresInDays:
          type: integer
          format: int64
          description: Optional key lifetime in days.
    ApiKeyResponse:
      type: object
      required:
        - id
        - keyPrefix
        - scopes
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        keyPrefix:
          type: string
          description: The non-secret leading segment, shown for identification.
        scopes:
          type: array
          items:
            type: string
        status:
          type: string
        createdAt:
          type: string
        expiresAt:
          type: string
          nullable: true
        lastUsedAt:
          type: string
          nullable: true
        revokedAt:
          type: string
          nullable: true
    ApiClientResponse:
      type: object
      required:
        - id
        - name
        - status
        - createdAt
        - keys
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        createdAt:
          type: string
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyResponse'
        rateLimitPerMin:
          type: integer
          nullable: true
          description: Per-minute rate-limit override (#603); null = the global default tier applies.
    SetRateLimitRequest:
      type: object
      properties:
        rateLimitPerMin:
          type: integer
          nullable: true
          description: The per-minute limit; null clears the override (use the default tier).
    IssuedApiKeyResponse:
      type: object
      required:
        - apiKey
        - key
      properties:
        apiKey:
          type: string
          description: The plaintext secret, shown once and never retrievable again.
        key:
          $ref: '#/components/schemas/ApiKeyResponse'
    ClientIdentityResponse:
      type: object
      required:
        - clientId
        - scopes
      properties:
        clientId:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            type: string
    PartnerPlayerResponse:
      type: object
      description: A player in the partner directory read (#597) — public fields only.
      required:
        - publicCode
      properties:
        publicCode:
          type: string
        displayName:
          type: string
          nullable: true
    ClientEffectiveCapabilitiesResponse:
      type: object
      required:
        - clientId
        - userId
        - capabilities
      properties:
        clientId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        capabilities:
          type: array
          items:
            type: string
    RankingCalculationRequest:
      type: object
      required:
        - teams
        - matchScore
      properties:
        teams:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Team'
          description: Map of team IDs to Team objects (exactly 2 teams required)
        matchScore:
          $ref: '#/components/schemas/MatchScore'
        options:
          $ref: '#/components/schemas/RatingCalculationOptions'

    RankingCalculationResponse:
      type: object
      required:
        - ratingChanges
        - players
        - teams
      properties:
        ratingChanges:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RatingChange'
          description: Map of player IDs to rating changes
        players:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PlayerProfile'
          description: Map of player IDs to updated player profiles
        teams:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Team'
          description: Map of team IDs to updated teams with updated players

    PlayerProfile:
      type: object
      required:
        - playerId
        - name
        - rating
      properties:
        playerId:
          type: string
        name:
          type: string
        rating:
          $ref: '#/components/schemas/Rating'
        group:
          type: string
          nullable: true
          description: >-
            Optional opaque group label for the binary group-category factor (#719). The calculator
            only compares the two sides' groups for equality: same group (or either side absent/null)
            yields factor 1 (normal rating change), a different group yields factor 0 (zeroed change).
            The value carries no meaning to the algorithm; classification is performed upstream.

    Team:
      type: object
      required:
        - teamId
        - name
        - players
      properties:
        teamId:
          type: string
          minLength: 1
          maxLength: 50
          description: Unique identifier for this team in the match context
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Team name (for singles - player name, for doubles - "Player1/Player2")
        players:
          type: array
          items:
            $ref: '#/components/schemas/PlayerProfile'
          minItems: 1
          maxItems: 2
          description: List of players in this team (1 for singles, 2 for doubles)
        teamType:
          $ref: '#/components/schemas/TeamType'
          default: SINGLES
          description: Type of team (SINGLES, DOUBLES, or MIXED_DOUBLES)

    TeamType:
      type: string
      enum:
        - SINGLES
        - DOUBLES
        - MIXED_DOUBLES
      description: |
        Team type:
        - SINGLES: 1 player per team
        - DOUBLES: 2 players per team
        - MIXED_DOUBLES: 2 players per team (male + female)

    Rating:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          description: The numeric NTRP rating value (e.g., "4.5", "4.123456")
        publishedLevel:
          $ref: '#/components/schemas/Level'
          description: The published level (optional in request, always present in response)

    Level:
      type: object
      required:
        - value
        - minRating
        - maxRating
      properties:
        value:
          type: string
          description: The published NTRP level value (e.g., "4.5")
        minRating:
          type: string
          description: Minimum rating for this level (inclusive)
        maxRating:
          type: string
          description: Maximum rating for this level (exclusive)

    MatchScore:
      type: object
      required:
        - sets
      properties:
        sets:
          type: array
          items:
            $ref: '#/components/schemas/SetScore'
        winnerTeamId:
          type: string
          description: Team ID of the match winner. Defaults to the team that won the most sets when omitted.
        loserTeamId:
          type: string
          description: Team ID of the match loser. Defaults to the team that lost the most sets when omitted; must differ from the winner and be one of the teams.

    SetScore:
      type: object
      required:
        - games
      properties:
        games:
          type: object
          additionalProperties:
            type: integer
        winnerTeamId:
          type: string
          description: Team ID of the set winner. Defaults to the team with the most games when omitted.
        loserTeamId:
          type: string
          description: Team ID of the set loser. Defaults to the team with the fewest games when omitted; must differ from the winner.
        tiebreak:
          $ref: '#/components/schemas/TiebreakScore'

    TiebreakScore:
      type: object
      required:
        - points
      description: |
        Informational only: documents how many points the tiebreak was (e.g. 7-5).
        The tiebreak is part of the set score, so its winner must be the set winner.
        Tiebreak points are not included in the dominance calculation of the match —
        only games count.
      properties:
        points:
          type: object
          additionalProperties:
            type: integer
        winnerTeamId:
          type: string
          description: Team ID of the tiebreak winner. Defaults to the team with the most points when omitted.
        loserTeamId:
          type: string
          description: Team ID of the tiebreak loser. Defaults to the team with the fewest points when omitted; must differ from the winner.

    RatingCalculationOptions:
      type: object
      properties:
        smoothingEnabled:
          type: boolean
          default: false
        smoothingFactor:
          type: number
          format: double
          default: 0.5

    RatingChange:
      type: object
      required:
        - change
        - previousRating
        - newRating
        - percentChange
        - levelChanged
      properties:
        change:
          type: string
          description: The absolute rating change (e.g., "+0.123456" or "-0.045678")
        previousRating:
          $ref: '#/components/schemas/Rating'
          description: The player's rating before the match
        newRating:
          $ref: '#/components/schemas/Rating'
          description: The player's rating after the match (includes updated publishedLevel)
        percentChange:
          type: string
          description: The percentage change in rating (e.g., "+2.75%")
        levelChanged:
          type: boolean
          description: Whether the player's published level changed (e.g., 4.0 → 4.5)

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    NameDto:
      type: object
      required:
        - id
        - type
        - value
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [FIRST, MIDDLE, LAST, SUFFIX, NICKNAME, PREFERRED, FULL, GOVERNMENT, DISPLAY]
        value:
          type: string
        isActive:
          type: boolean
          default: true

    ContactDto:
      type: object
      required:
        - id
        - type
        - value
        - source
        - status
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [EMAIL, PHONE]
        value:
          type: string
        source:
          type: string
          enum: [GOOGLE, FACEBOOK, MANUAL]
        status:
          type: string
          enum: [PENDING, VERIFIED, FAILED]
        method:
          type: string
          nullable: true
          enum: [OAUTH_PROVIDER, EMAIL_LINK, SMS_OTP, WHATSAPP_OTP, VIBER_OTP, ADMIN_OVERRIDE]
        isPrimary:
          type: boolean
        isActive:
          type: boolean

    IdentityDto:
      type: object
      required:
        - provider
        - providerUid
      properties:
        provider:
          type: string
          enum: [GOOGLE, FACEBOOK, PASSWORD]
        providerUid:
          type: string
        isPrimary:
          type: boolean

    MarkDuplicatesRequest:
      type: object
      description: The users to mark as duplicates of the canonical account in the path (#124).
      required:
        - duplicateIds
      properties:
        duplicateIds:
          type: array
          items:
            type: string
            format: uuid

    MergeAccountsRequest:
      type: object
      description: >-
        The retired account to consolidate into the survivor (in the path) plus a required, non-blank
        verification note recording how the admin confirmed the two accounts are the same person (#643).
      required:
        - retiredAccountId
        - verificationNote
      properties:
        retiredAccountId:
          type: string
          format: uuid
          description: The account whose participation/membership records are moved onto the survivor.
        verificationNote:
          type: string
          description: Required, non-blank note kept in the audit trail; the merge is irreversible.

    CreateUserRequest:
      type: object
      description: |
        Profile details the client supplies. Identity and email come from the verified
        token and are ignored if present here. dateOfBirth and sex are required — every
        member supplies them at sign-up because they drive tournament-category eligibility.
        displayName is the single name shown in the UI; if omitted, the token's name
        (Google/Facebook) is used. Structured names (FIRST/LAST/nicknames) come later.
      required:
        - dateOfBirth
        - sex
        - proposedRating
      properties:
        displayName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        dateOfBirth:
          type: string
          format: date
          description: ISO-8601 (yyyy-MM-dd)
        sex:
          type: string
          enum: [Male, Female]
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 (defaults to PH)
        proposedRating:
          type: string
          description: Required self-reported NTRP rating (1.0–7.0) for a rater to approve/override.

    ProfileRequest:
      type: object
      description: |
        Mutable profile fields. PATCH leaves omitted (null) fields unchanged;
        PUT replaces all of them (omitted fields are cleared). The profile photo
        is set separately via PUT /api/v1/users/{id}/photo (#303).
      properties:
        dateOfBirth:
          type: string
          format: date
          nullable: true
        sex:
          type: string
          nullable: true
          enum: [Male, Female]
        city:
          type: string
          nullable: true

    PhotoSettingsRequest:
      type: object
      description: |
        Profile-photo controls (#303). A blank/absent customPhotoUrl clears the custom photo
        (reverting to the OAuth photo); a non-blank value must be an http(s) URL. hidden suppresses
        the photo everywhere. Neither is overwritten by the login-time OAuth photo sync.
      properties:
        customPhotoUrl:
          type: string
          nullable: true
          description: Public http(s) image URL to show instead of the OAuth photo; blank/absent clears it.
        hidden:
          type: boolean
          default: false
          description: When true, the profile photo is suppressed everywhere.

    MatchHistoryVisibilityRequest:
      type: object
      description: >-
        Per-player match-history privacy control (#622). hidden = true withholds the player's match
        history from unprivileged viewers on the public profile.
      properties:
        hidden:
          type: boolean
          default: false
          description: When true, hide match history from other (non-elevated) players.

    PublicPlayerResponse:
      type: object
      description: Privacy-conscious player card resolved from a public code (auth-gated deep link).
      required:
        - publicCode
      properties:
        publicCode:
          type: string
          description: Short, human-readable, shareable player code (e.g. "K7Q2MX").
        displayName:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
          description: Registered email (#630) — PII, revealed only to the profile owner or a HOST/CLUB_OWNER/RATER/ADMINISTRATOR viewer; null/omitted for other players and anonymous callers.
        rating:
          nullable: true
          type: object
          required:
            - value
          properties:
            value:
              type: string
            level:
              type: string
              nullable: true
            confidence:
              type: string
              nullable: true
              description: Computed rating confidence 0..1 (#343), shown as a %; 0 when not match-derived.
        isDisabled:
          type: boolean
          description: True when this profile was marked a duplicate and disabled (#124); the card is a "merged" notice.
        isPlaceholder:
          type: boolean
          description: True for a login-less, not-yet-claimed placeholder player (#496); the card shows an "unclaimed" indicator + a "Claim this account" entry point.
        isDeleted:
          type: boolean
          description: True for an admin-soft-deleted account (#518); rendered as a dominant "Deleted" chip wherever the name appears.
        matchHistoryHidden:
          type: boolean
          default: false
          description: True when the owner hid their match history from other players (#622); lets the owner's own profile warn that it is hidden.
        canonical:
          nullable: true
          description: When disabled, the canonical ("true") account to link to.
          type: object
          required:
            - publicCode
          properties:
            publicCode:
              type: string
            displayName:
              type: string
              nullable: true
            photoUrl:
              type: string
              nullable: true

    CreatePlaceholderRequest:
      type: object
      description: Body for POST /api/v1/users/placeholders — create a login-less placeholder player (#496).
      required:
        - displayName
        - sex
      properties:
        displayName:
          type: string
          description: The single name shown for the placeholder (required).
        sex:
          type: string
          enum: [Male, Female]
          description: Required — drives (band, sex) standings/points.
        dateOfBirth:
          type: string
          format: date
          nullable: true
          description: Optional ISO date of birth.
        initialRating:
          type: string
          nullable: true
          description: >-
            Optional NTRP initial rating (1.0–7.0), set in the same flow (#503). RATER/ADMINISTRATOR-gated
            and validated only when present; omit it to create a rating-less placeholder.

    ClaimRequest:
      type: object
      description: Body for POST /api/v1/users/claim — the secret code the caller pastes to adopt a placeholder (#496).
      required:
        - code
      properties:
        code:
          type: string
          description: The secret claim code handed to the person by an administrator.

    ClaimCodeResponse:
      type: object
      description: The one-time plaintext claim code returned on generation (#496); never stored or re-derivable.
      required:
        - code
        - expiresAt
        - placeholderPublicCode
      properties:
        code:
          type: string
          description: The plaintext claim code — shown once; hand it to the verified person.
        expiresAt:
          type: string
          format: date-time
          description: When the code expires (7 days from generation).
        placeholderPublicCode:
          type: string
          description: The placeholder's shareable public code, so the UI can show which account the code adopts.

    PlayerMatchHistoryEntry:
      type: object
      description: One row of a player's match history. Ratings shown only as the published NTRP band, and only when rated.
      required:
        - matchId
        - publicCode
        - matchDate
        - status
        - rated
        - setScores
        - partners
        - opponents
      properties:
        matchId:
          type: string
          format: uuid
        publicCode:
          type: string
          description: The match's shareable public code; link a history row to /matches/{publicCode}.
        matchDate:
          type: string
          format: date
        status:
          type: string
          description: Match lifecycle status (SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED).
        rated:
          type: boolean
          description: True once the match has been calculated and contributes to the current rating.
        result:
          type: string
          nullable: true
          description: WIN or LOSS from this player's perspective; null when there is no recorded winner yet.
        setScores:
          type: array
          description: Set scores oriented as "playerGames-opponentGames"; empty until a result is recorded.
          items:
            type: string
        partners:
          type: array
          description: The player's teammate(s) — empty for singles, one entry for doubles.
          items:
            $ref: '#/components/schemas/MatchHistoryParticipant'
        opponents:
          type: array
          description: The opposing side — one player for singles, two for doubles.
          items:
            $ref: '#/components/schemas/MatchHistoryParticipant'
        playerLevelAtMatch:
          type: string
          nullable: true
          description: This player's published NTRP band at the time of the match (rated matches only).
        playerRatingAtMatch:
          type: string
          nullable: true
          description: This player's raw NTRP at the time of the match (#583/#654) — present only for a viewer who may see raw ratings; null otherwise.
        playerConfidence:
          type: string
          nullable: true
          description: The player's current rating confidence 0..1 (#343), shown as a %; 0 when not match-derived.

    PlayerMatchHistoryPage:
      type: object
      description: A page of a player's match history (#284) — the requested slice plus the total matching count.
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlayerMatchHistoryEntry'
        total:
          type: integer
          description: Count of matches matching the (optional) search, for numbered pagination.
        hidden:
          type: boolean
          default: false
          description: True when the owner hid their history and the viewer is unprivileged — the list is intentionally empty (#622).

    MatchHistoryParticipant:
      type: object
      description: A teammate or opponent on a match-history row, with their NTRP band at the time of the match.
      required:
        - publicCode
      properties:
        publicCode:
          type: string
        displayName:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        levelAtMatch:
          type: string
          nullable: true
          description: This participant's published NTRP band at the time of the match (rated matches only).
        ratingAtMatch:
          type: string
          nullable: true
          description: This participant's raw NTRP at the time of the match (#583/#654) — present only for a viewer who may see raw ratings; null otherwise.
        confidence:
          type: string
          nullable: true
          description: This participant's current rating confidence 0..1 (#343), shown as a %; 0 when not match-derived.
        isPlaceholder:
          type: boolean
          description: True for a login-less, not-yet-claimed placeholder player (#496/#505); the history row shows an "Unclaimed" tag beside the name.

        isDeleted:
          type: boolean
          description: True for an admin-soft-deleted account (#518); rendered as a dominant "Deleted" chip wherever the name appears.
    PlayerResultsSummary:
      type: object
      description: A player's win–loss record over time (#276), split into singles and doubles; one bucket per month, oldest first.
      required:
        - singles
        - doubles
      properties:
        singles:
          type: array
          items:
            $ref: '#/components/schemas/ResultsBucket'
        doubles:
          type: array
          items:
            $ref: '#/components/schemas/ResultsBucket'

    ResultsBucket:
      type: object
      description: Win/loss counts for one calendar month, from the viewed player's perspective.
      required:
        - period
        - wins
        - losses
      properties:
        period:
          type: string
          description: The calendar month as "yyyy-MM".
        wins:
          type: integer
        losses:
          type: integer

    PlayerStandingResponse:
      type: object
      description: >-
        A player's current band+sex rank and the source-aware competitive metric under the active
        standings source (#448, #457). Under POINTS the public points total is returned; under RATING
        the precise rating is returned only to RATER/ADMINISTRATOR or the owner (#186), else omitted.
      required:
        - band
        - bandLabel
        - rank
        - source
      properties:
        band:
          type: string
          description: The band's persisted code (e.g. "4.0").
        bandLabel:
          type: string
          description: The band's UI header label (e.g. "NTRP 4.0 Band Race").
        sex:
          type: string
          nullable: true
          description: The sex group (Male, Female, or null for Unspecified).
        rank:
          type: integer
          description: 1-based rank within the (band, sex) group.
        source:
          type: string
          description: Which race this rank is for (#424); RATING or POINTS. Tells the client which metric to show.
        points:
          type: string
          nullable: true
          description: >-
            The snapshot points backing the rank as a decimal string, present (public) only when source=POINTS (#457).
        rating:
          type: string
          nullable: true
          description: >-
            The precise current rating as a decimal string, present only when source=RATING and the caller may see
            rates (RATER/ADMINISTRATOR or the owner, #186); omitted for anonymous / other viewers.

    ActivePointsAwardResponse:
      type: object
      description: One ACTIVE ranking-point award on a player's points audit (#448), linked to its granting match.
      required:
        - id
        - points
        - band
        - pointClass
        - validUntil
      properties:
        id:
          type: string
          format: uuid
        points:
          type: string
          description: The award's points as a decimal string.
        band:
          type: string
          description: The NTRP band tagged on the award (e.g. "4.0").
        pointClass:
          type: string
          description: The point class (e.g. SEASONAL_TOURNAMENT_3M, ANNUAL_TOURNAMENT).
        validUntil:
          type: string
          description: The award's expiry (exclusive end of its validity window) as an ISO date-time.
        matchCode:
          type: string
          nullable: true
          description: The granting match's public code; link to /matches/{matchCode}. Null for manual or pre-V19 awards.
        eventCode:
          type: string
          nullable: true
          description: Fallback event code when there is no match link; link to /events/{eventCode}.

    UserSummaryPageResponse:
      type: object
      description: A page of user-search results plus the total match count, for numbered pagination (#232).
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummaryResponse'
        total:
          type: integer

    UserSummaryResponse:
      type: object
      description: >-
        Slim user shape for search results (player picker, role grants, research). Carries the
        current NTRP rating and a computed age; raw date of birth is withheld for privacy (#64).
      required:
        - id
        - publicCode
        - capabilities
      properties:
        id:
          type: string
          format: uuid
        publicCode:
          type: string
          description: Short, human-readable, shareable player code (e.g. "K7Q2MX").
        displayName:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        sex:
          type: string
          nullable: true
          enum: [Male, Female]
        age:
          type: integer
          nullable: true
          description: Whole years as of today, computed from date of birth.
        rating:
          nullable: true
          type: object
          required:
            - value
          properties:
            value:
              type: string
            level:
              type: string
              nullable: true
            confidence:
              type: string
              nullable: true
              description: Computed rating confidence 0..1 (#343), shown as a %; 0 when not match-derived.
        capabilities:
          type: array
          items:
            type: string
            enum: [PLAYER, HOST, CLUB_OWNER, ADMINISTRATOR, RATER, RESEARCHER, POINTS_MANAGER]
        record:
          nullable: true
          type: object
          description: Decided win–loss record, singles + doubles combined (#342); populated for research results, else absent.
          required:
            - wins
            - losses
            - total
          properties:
            wins:
              type: integer
            losses:
              type: integer
            total:
              type: integer
              description: Total decided matches (wins + losses).
        isPlaceholder:
          type: boolean
          description: True for a login-less, not-yet-claimed placeholder player (#496/#505); pickers/search show an "Unclaimed" tag beside the name.

        isDeleted:
          type: boolean
          description: True for an admin-soft-deleted account (#518); rendered as a dominant "Deleted" chip wherever the name appears.
        linkStatus:
          type: string
          enum: [GOOGLE, FACEBOOK, PASSWORD, NONE]
          description: >-
            Derived login/link status (#643): the account's login anchor (GOOGLE, FACEBOOK, or PASSWORD) or
            NONE for a login-less placeholder. Read-only; the account-merge UI shows it per account.
    UserResponse:
      type: object
      required:
        - id
        - publicCode
        - country
        - kycVerified
        - isActive
        - names
        - contacts
        - identities
        - capabilities
      properties:
        previewRatingsAsNonAdmin:
          type: boolean
          description: Per-admin "preview as non-admin" raw-rating toggle state (#583); false unless set.
        id:
          type: string
          format: uuid
        publicCode:
          type: string
          description: Short, human-readable, shareable player code (e.g. "K7Q2MX").
        firebaseUid:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
          description: Effective photo to display — respects the hide flag and custom URL (#303).
        customPhotoUrl:
          type: string
          nullable: true
          description: User-set public image URL, if any (#303).
        photoHidden:
          type: boolean
          default: false
          description: When true, the profile photo is suppressed everywhere (#303).
        matchHistoryHidden:
          type: boolean
          default: false
          description: When true, the player's match history is hidden from other players on the public profile (#622).
        dateOfBirth:
          type: string
          format: date
          nullable: true
        sex:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
        kycVerified:
          type: boolean
        isActive:
          type: boolean
        canonicalUserId:
          type: string
          format: uuid
          nullable: true
          description: When set, this user is a disabled duplicate of the referenced canonical account (#124).
        names:
          type: array
          items:
            $ref: '#/components/schemas/NameDto'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactDto'
        identities:
          type: array
          items:
            $ref: '#/components/schemas/IdentityDto'
        capabilities:
          type: array
          items:
            type: string
            enum: [PLAYER, HOST, CLUB_OWNER, ADMINISTRATOR, RATER, RESEARCHER, POINTS_MANAGER]

    ContactCreateRequest:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum: [EMAIL, PHONE]
        value:
          type: string
        isPrimary:
          type: boolean
          default: true

    ContactStateRequest:
      type: object
      required:
        - isActive
      properties:
        isActive:
          type: boolean

    VerificationRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [PENDING, VERIFIED, FAILED]
        method:
          type: string
          nullable: true
          description: Defaults to ADMIN_OVERRIDE when status is VERIFIED.
          enum: [OAUTH_PROVIDER, EMAIL_LINK, SMS_OTP, WHATSAPP_OTP, VIBER_OTP, ADMIN_OVERRIDE]

    ContactResponse:
      type: object
      required:
        - id
        - userId
        - type
        - value
        - source
        - status
        - isPrimary
        - isActive
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [EMAIL, PHONE]
        value:
          type: string
        source:
          type: string
          enum: [GOOGLE, FACEBOOK, MANUAL]
        status:
          type: string
          enum: [PENDING, VERIFIED, FAILED]
        method:
          type: string
          nullable: true
          enum: [OAUTH_PROVIDER, EMAIL_LINK, SMS_OTP, WHATSAPP_OTP, VIBER_OTP, ADMIN_OVERRIDE]
        isPrimary:
          type: boolean
        isActive:
          type: boolean
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        verifiedBy:
          type: string
          format: uuid
          nullable: true
        disabledAt:
          type: string
          format: date-time
          nullable: true

    NameCreateRequest:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: DISPLAY, FIRST, and LAST replace the user's current active name of that type.
          enum: [FIRST, MIDDLE, LAST, SUFFIX, NICKNAME, PREFERRED, FULL, GOVERNMENT, DISPLAY]
        value:
          type: string

    NameStateRequest:
      type: object
      required:
        - isActive
      properties:
        isActive:
          type: boolean

    NameResponse:
      type: object
      required:
        - id
        - userId
        - type
        - value
        - isActive
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [FIRST, MIDDLE, LAST, SUFFIX, NICKNAME, PREFERRED, FULL, GOVERNMENT, DISPLAY]
        value:
          type: string
        isActive:
          type: boolean
        disabledAt:
          type: string
          format: date-time
          nullable: true

    CapabilityGrantRequest:
      type: object
      required:
        - capability
      properties:
        capability:
          type: string
          enum: [PLAYER, HOST, CLUB_OWNER, ADMINISTRATOR, RATER, RESEARCHER, POINTS_MANAGER]

    CapabilityResponse:
      type: object
      required:
        - capability
        - isActive
      properties:
        capability:
          type: string
          enum: [PLAYER, HOST, CLUB_OWNER, ADMINISTRATOR, RATER, RESEARCHER, POINTS_MANAGER]
        isActive:
          type: boolean
        grantedBy:
          type: string
          format: uuid
          nullable: true
        grantedAt:
          type: string
          format: date-time
          nullable: true
        revokedBy:
          type: string
          format: uuid
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true

    SetRatingRequest:
      type: object
      description: >-
        Set a user's NTRP rating. Provide `band` (the normal path) to store the band midpoint
        (floor + 0.25), or `value` for a precise override. Exactly one is required.
      properties:
        band:
          type: string
          nullable: true
          description: >-
            NTRP band 1.0–7.0 (0.5 steps); stored as the band midpoint (e.g. 3.5 → 3.75) so an
            initial rating sits centered in its band rather than at the edge.
        value:
          type: string
          nullable: true
          description: Precise NTRP value (1.0–7.0) for an override; stored as-is.

    UserRatingResponse:
      type: object
      required:
        - confidence
        - matchesPlayed
      properties:
        value:
          type: string
          nullable: true
          description: >-
            The exact rating — privacy-withheld from players (#64/#114); present only for a rating
            manager (ADMINISTRATOR). Players receive the band (level) and bandPosition instead.
        level:
          type: string
          nullable: true
        bandPosition:
          type: number
          format: double
          nullable: true
          description: >-
            Normalized 0..1 position within the current NTRP band (floor 0 → ceiling 1) for the
            own-profile "speed meter" (#114). Never reveals the exact rating.
        confidence:
          type: string
          description: >-
            Computed rating confidence 0..1 (#343), shown as a %: log-logistic time decay since the
            last match calc, ramped over ~5 matches; 0 when the rating isn't match-derived.
        matchesPlayed:
          type: integer
        lastMatchDate:
          type: string
          format: date
          nullable: true

    RatingHistoryResponse:
      type: object
      required:
        - id
        - previousRating
        - newRating
        - ratingChange
        - levelChanged
        - smoothingApplied
        - calculatedAt
      properties:
        id:
          type: string
          format: uuid
        matchId:
          type: string
          format: uuid
          nullable: true
        previousRating:
          type: string
        newRating:
          type: string
        ratingChange:
          type: string
        percentChange:
          type: string
          nullable: true
        previousLevel:
          type: string
          nullable: true
        newLevel:
          type: string
          nullable: true
        levelChanged:
          type: boolean
        dominanceFactor:
          type: string
          nullable: true
        smoothingApplied:
          type: boolean
        smoothingFactor:
          type: string
          nullable: true
        setBreakdown:
          type: array
          description: Per-set calculation steps (#110); empty for v1/initial/pre-#110 rows.
          items:
            $ref: '#/components/schemas/SetBreakdownResponse'
        calculatedAt:
          type: string
          format: date-time

    PendingAssessmentResponse:
      type: object
      required:
        - userId
        - publicCode
      properties:
        userId:
          type: string
          format: uuid
        publicCode:
          type: string
          description: Short shareable player code; link the card to /players/{publicCode}.
        displayName:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        sex:
          type: string
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
        age:
          type: integer
          nullable: true
          description: Whole years as of today, computed from dateOfBirth.
        proposedRating:
          type: string
          nullable: true
          description: The player's self-reported NTRP band at sign-up, if any (admins approve/override).

    PendingAssessmentPageResponse:
      type: object
      description: A page of pending assessments plus the total count of all pending users.
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PendingAssessmentResponse'
        total:
          type: integer

    CreateRatingRequestRequest:
      type: object
      required:
        - justification
      properties:
        justification:
          type: string

    ApproveRatingRequestRequest:
      type: object
      required:
        - rating
      properties:
        rating:
          type: string
          description: The new NTRP rating to apply (1.0–7.0).

    DenyRatingRequestRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string

    RatingRequestResponse:
      type: object
      description: A player's re-rate request and its resolution (#140).
      required:
        - id
        - userId
        - status
        - justification
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, APPROVED, DENIED]
        justification:
          type: string
        newRating:
          type: string
          nullable: true
          description: The approved rating as its published NTRP band (never the raw value).
        reason:
          type: string
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        requester:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AuditPersonResponse'

    RatingRequestPageResponse:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RatingRequestResponse'
        total:
          type: integer

    CreateFixtureRequest:
      type: object
      required:
        - matchFormat
        - matchType
        - matchDate
      properties:
        matchFormat:
          type: string
          enum: [SINGLES, DOUBLES, MIXED_DOUBLES]
        matchType:
          type: string
          enum: [OPEN_PLAY, TOURNAMENT]
          description: The competitive context; scales the calculated rating change by a per-match-type factor (#108).
        matchDate:
          type: string
          format: date
        team1:
          type: array
          description: >-
            Raw player ids for side 1. A side is specified EITHER as raw ids here OR as a durable event
            team ref (team1Id, #720) — not both. Omit when using team1Id.
          items:
            type: string
            format: uuid
        team2:
          type: array
          description: Raw player ids for side 2; omit when using team2Id (#720).
          items:
            type: string
            format: uuid
        team1Id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Durable event team ref for side 1 (#720); alternative to team1. Resolves to the team's members
            (in slot order); requires eventId and the team's size must match the effective format.
        team2Id:
          type: string
          format: uuid
          nullable: true
          description: Durable event team ref for side 2 (#720); alternative to team2.
        venue:
          type: string
          nullable: true
        tournamentName:
          type: string
          nullable: true
        eventId:
          type: string
          format: uuid
          nullable: true
          description: When set, the fixture belongs to this event and both sides must be participants (#138).
        team1Handicap:
          type: string
          nullable: true
          description: >-
            Optional per-side rating handicap (#486) for team1, in team-mean NTRP units, 0 < h <= 1.0.
            Deducted from that side's rating for the rating-delta computation only; the delta is applied to
            the players' true ratings. Null/omitted = no handicap. See RATING_HANDICAP.md.
        team2Handicap:
          type: string
          nullable: true
          description: Optional per-side rating handicap (#486) for team2, in team-mean NTRP units, 0 < h <= 1.0.
        isPlacementMatch:
          type: boolean
          description: Tournament placement match (#525) — when true this fixture decides a placement.
        placementBracket:
          type: string
          nullable: true
          enum: [CHAMPIONSHIP_FINALS, PLATE_FINALS]
          description: Which placement the match decides (#525) — CHAMPIONSHIP_FINALS (1st/2nd) or PLATE_FINALS (3rd/4th). A placing is awarded only where a fixture decided it (#837); every other fixture earns the open-play per-set schedule (#836).

    SetScoreRequest:
      type: object
      description: >-
        One set's score. Games are non-negative; a set decided on games must be won with at least
        4 games (#213) — standard tennis is 6, but a lower floor of 4 allows shortened formats.
        Sets with equal games are decided by the tiebreak and are exempt from that floor.
      required:
        - team1Games
        - team2Games
      properties:
        team1Games:
          type: integer
        team2Games:
          type: integer
        tiebreakTeam1Points:
          type: integer
          nullable: true
        tiebreakTeam2Points:
          type: integer
          nullable: true

    MatchResultRequest:
      type: object
      required:
        - sets
      properties:
        sets:
          type: array
          items:
            $ref: '#/components/schemas/SetScoreRequest'

    MatchScoreCorrectionRequest:
      type: object
      description: >-
        Corrected set scores for an already-rated match (#776). dryRun defaults to TRUE — a full preview
        with no writes — because the correction is destructive to rating state; send false to apply.
      required:
        - sets
      properties:
        sets:
          type: array
          items:
            $ref: '#/components/schemas/SetScoreRequest'
        dryRun:
          type: boolean
          default: true
          description: Preview only (default). Send false to persist the correction.

    MatchCorrectionPlayerImpact:
      type: object
      description: >-
        One player's rating impact from a score correction (#776): reversedChange comes off and newChange
        goes on, so netAdjustment (newChange - reversedChange) is what moves the current rating.
      required:
        - userId
        - currentRating
        - reversedChange
        - newChange
        - netAdjustment
        - resultingRating
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        currentRating:
          type: string
          description: The player's rating before the correction is applied.
        reversedChange:
          type: string
          description: The delta originally applied for this match, taken verbatim from its live history row.
        newChange:
          type: string
          description: >-
            The delta recomputed for the corrected score from the player's rating AT THE TIME (the history
            row's previous_rating), not from their present-day rating.
        netAdjustment:
          type: string
          description: newChange - reversedChange — the signed amount applied to the current rating.
        resultingRating:
          type: string
        previousLevel:
          type: string
          nullable: true
        resultingLevel:
          type: string
          nullable: true
        levelChanged:
          type: boolean

    MatchScoreCorrectionResponse:
      type: object
      description: >-
        The outcome of a score correction (#776). With dryRun true nothing was written and this is the
        confirmation surface the admin approves; with dryRun false it reports what was applied.
      required:
        - dryRun
        - matchPublicCode
        - previousScore
        - newScore
        - winnerChanged
        - impacts
      properties:
        dryRun:
          type: boolean
        matchPublicCode:
          type: string
        previousScore:
          type: string
          description: The score as recorded before the correction, e.g. "6-4, 3-6, 7-5".
        newScore:
          type: string
        winnerChanged:
          type: boolean
          description: True when the corrected score moves the win to the other side.
        impacts:
          type: array
          items:
            $ref: '#/components/schemas/MatchCorrectionPlayerImpact'
        awardsRevoked:
          type: integer
          description: Ranking-point awards revoked by this correction; 0 when the match pays no points.
        awardsReissued:
          type: integer
        pointsSuppressedByGlobalFlag:
          type: boolean
          description: >-
            True when the event opted into points but the global kill switch (#641/#752) suppressed the
            re-issue, so zero re-issued awards is reported rather than looking silently correct.

    MatchStateRequest:
      type: object
      required:
        - isActive
      properties:
        isActive:
          type: boolean

    ReorderMatchesRequest:
      type: object
      required:
        - matchIds
      properties:
        matchIds:
          type: array
          description: Same-date match ids in the desired calculation order (#331/#332).
          items:
            type: string
            format: uuid

    MatchSideResponse:
      type: object
      required:
        - teamId
        - userIds
      properties:
        teamId:
          type: string
          format: uuid
        userIds:
          type: array
          items:
            type: string
            format: uuid

    MatchSetResponse:
      type: object
      required:
        - setNumber
        - team1Games
        - team2Games
        - winnerTeamId
      properties:
        setNumber:
          type: integer
        team1Games:
          type: integer
        team2Games:
          type: integer
        winnerTeamId:
          type: string
          format: uuid
        tiebreakTeam1Points:
          type: integer
          nullable: true
        tiebreakTeam2Points:
          type: integer
          nullable: true

    MatchResponse:
      type: object
      required:
        - id
        - publicCode
        - matchFormat
        - matchType
        - matchDate
        - status
        - team1
        - team2
        - sets
        - isActive
      properties:
        id:
          type: string
          format: uuid
        publicCode:
          type: string
          description: Stable, shareable public code for the match (#136).
        matchFormat:
          type: string
          enum: [SINGLES, DOUBLES, MIXED_DOUBLES]
        matchType:
          type: string
          enum: [OPEN_PLAY, TOURNAMENT]
          description: The competitive context the match was played under (#108).
        matchDate:
          type: string
          format: date
        status:
          type: string
          enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]
        team1:
          $ref: '#/components/schemas/MatchSideResponse'
        team2:
          $ref: '#/components/schemas/MatchSideResponse'
        winnerTeamId:
          type: string
          format: uuid
          nullable: true
        sets:
          type: array
          items:
            $ref: '#/components/schemas/MatchSetResponse'
        venue:
          type: string
          nullable: true
        tournamentName:
          type: string
          nullable: true
        isActive:
          type: boolean
        completedAt:
          type: string
          format: date-time
          nullable: true
        ratedAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          format: uuid
          nullable: true
        recordedBy:
          type: string
          format: uuid
          nullable: true
        eventId:
          type: string
          format: uuid
          nullable: true
          description: The event this fixture belongs to, if any (#138).
        team1Handicap:
          type: string
          nullable: true
          description: Per-side rating handicap (#486) for team1, in team-mean NTRP units; null = none. Shown for transparency.
        team2Handicap:
          type: string
          nullable: true
          description: Per-side rating handicap (#486) for team2, in team-mean NTRP units; null = none.

    CreateEventRequest:
      type: object
      required:
        - name
        - startDate
        - endDate
        - format
        - clubId
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        format:
          type: string
          enum: [SINGLES, DOUBLES, MIXED_DOUBLES]
          description: The event's organizing format (#720); REQUIRED. Sets the default fixture format (team size is 1-2, independent of it, #734).
        participantIds:
          type: array
          items:
            type: string
            format: uuid
        clubId:
          type: string
          format: uuid
          description: Optional club to file the event under (#313); omit for a clubless ("Open") event.
        circuitId:
          type: string
          format: uuid
          nullable: true
          description: The circuit a TOURNAMENT event belongs to (#525); required for tournaments, ignored otherwise.
        type:
          type: string
          nullable: true
          enum: [OPEN_PLAY, TOURNAMENT]
          description: Event class (#403); omit for the OPEN_PLAY default.
        awardRankingPoints:
          type: boolean
          nullable: true
          description: >-
            Whether finalizing this event awards ranking points per the global schedules (#559). Omit for
            the default (true — "Award Ranking Points" is on unless the organizer unchecks it). Coerced to
            false when the global "Award ranking points" flag (#641) is off (#752): the request is
            accepted, the created event simply reports awardRankingPoints false.

    SetHandicapsRequest:
      type: object
      description: >-
        Set or clear a fixture's per-side rating handicaps (#486). Each is a team-mean NTRP-unit value in
        the range 0 < h <= 1.0, or null to clear that side. Only settable while the fixture is unrated.
      properties:
        team1Handicap:
          type: string
          nullable: true
          description: Handicap for team1 in team-mean NTRP units, 0 < h <= 1.0; null clears it.
        team2Handicap:
          type: string
          nullable: true
          description: Handicap for team2 in team-mean NTRP units, 0 < h <= 1.0; null clears it.

    UpdateEventRequest:
      type: object
      description: Partial update of an event (#269). Only the name is editable today; fields left unset are unchanged.
      properties:
        name:
          type: string
          description: The new event name (non-blank; trimmed).

    SetEventClubRequest:
      type: object
      description: >-
        RE-FILE the event under a different club (#319). Since #794 an event always belongs to a club, so
        this changes which one but can no longer clear it — that was the second way a clubless event could
        arise. #782's administrator re-filing of a FINALIZED event is unaffected; it is club-to-club.
      required:
        - clubId
      properties:
        clubId:
          type: string
          format: uuid
          description: The club to re-file the event under. Must exist, and the caller must own it (#789).

    SetCalcPriorityRequest:
      type: object
      required:
        - priority
      description: Set an event's rating-calculation processing priority (#335).
      properties:
        priority:
          type: number
          format: double
          description: The processing key (end-date epoch-day scale); lower = processed earlier.

    AddParticipantRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          format: uuid

    DecideParticipantRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [APPROVED, HOLD]
          description: The host's decision on a participant request (#201).

    EventParticipantResponse:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        publicCode:
          type: string
          nullable: true
        sex:
          type: string
          nullable: true
          enum: [Male, Female]
        age:
          type: integer
          nullable: true
          description: Whole years as of today, computed from date of birth.
        rating:
          nullable: true
          type: object
          required:
            - value
          properties:
            value:
              type: string
            level:
              type: string
              nullable: true
            confidence:
              type: string
              nullable: true
              description: Computed rating confidence 0..1 (#343), shown as a %; 0 when not match-derived.
        status:
          type: string
          nullable: true
          enum: [APPROVED, PENDING, HOLD]
          description: Participant standing (#201); null on the public roster (approved only).
        isPlaceholder:
          type: boolean
          description: True for a login-less, not-yet-claimed placeholder player (#496/#505); the roster shows an "Unclaimed" tag beside the name.

        isDeleted:
          type: boolean
          description: True for an admin-soft-deleted account (#518); rendered as a dominant "Deleted" chip wherever the name appears.
    MyEventResponse:
      type: object
      description: One of the caller's own events (#202) with their standing in it.
      required:
        - publicCode
        - name
        - startDate
        - endDate
        - status
      properties:
        publicCode:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
          enum: [APPROVED, PENDING, HOLD]
        isFinalized:
          type: boolean
          description: True once the event is finalized (#403/#483); always buckets to Finalized on the client.
        completedMatchCount:
          type: integer
          description: Recorded results (COMPLETED with a decided winner) in the event (#483); the client's has-results signal.

    EventClubDto:
      type: object
      description: >-
        The club an event is filed under (#313), as carried on an event response. Every field is
        non-null by construction — the whole object is absent for a clubless ("Open") event, so a
        consumer checks for the object once rather than testing each detail. publicCode is the club's
        shareable code (#327), included so a club reference beside an event links straight to that
        club's public page (#780) without a second lookup; the events list is read by viewers who
        cannot list clubs.
      required:
        - id
        - name
        - publicCode
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        publicCode:
          type: string

    EventResponse:
      type: object
      required:
        - id
        - publicCode
        - name
        - startDate
        - endDate
        - isActive
        - participants
        - format
        - type
      properties:
        id:
          type: string
          format: uuid
        publicCode:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        format:
          type: string
          enum: [SINGLES, DOUBLES, MIXED_DOUBLES]
          description: The event's organizing format (#720).
        isActive:
          type: boolean
        participants:
          type: array
          items:
            $ref: '#/components/schemas/EventParticipantResponse'
        creatorDisplayName:
          type: string
          nullable: true
          description: The filing host's display name (#270); null for legacy events with no recorded creator.
        creatorPublicCode:
          type: string
          nullable: true
          description: The filing host's public code (#270), for linking to their profile; null if unknown.
        club:
          allOf:
            - $ref: '#/components/schemas/EventClubDto'
          nullable: true
          description: >-
            The event's club (#313), or null for a clubless ("Open") event. Nested rather than flat
            nullable fields so the invariant is structural: either the club is present with all of its
            details, or it is absent entirely — one null check instead of three that could disagree.
        circuitId:
          type: string
          format: uuid
          nullable: true
          description: The circuit a TOURNAMENT event belongs to (#525); null for non-tournament events.
        calcPriority:
          type: number
          format: double
          nullable: true
          description: Admin override for calculation processing order (#335); null = order by end date.
        type:
          type: string
          enum: [OPEN_PLAY, TOURNAMENT]
          description: The event's class (#403).
        finalizedAt:
          type: string
          format: date-time
          nullable: true
          description: When the event was finalized (#403); null while open.
        isFinalized:
          type: boolean
          description: True once the event is finalized (#403) — closed to changes; its matches queue for rating.
        completedMatchCount:
          type: integer
          description: Recorded results (COMPLETED with a decided winner) in the event (#483); the client's has-results signal.
        isRated:
          type: boolean
          description: >-
            True once every recorded result in the event has been rated (#772) — the event list's
            "Rated" badge. Binary by design: a partly-rated event reads as not rated, since a rating run
            completes in seconds. False for an event with no recorded results. Populated on the event
            list payload only, like completedMatchCount.
        awardRankingPoints:
          type: boolean
          description: Whether finalizing this event awards ranking points per the global schedules (#559); default true.
        awardingSuppressedByGlobalFlag:
          type: boolean
          description: >-
            Finalize outcome only (#752): true when the finalize awarded nothing because the global
            "Award ranking points" flag (#641) is off, even though the event's own flag is set. Always
            false on the other event reads — it describes what a finalize just did, not event state.

    CreateEventTeamRequest:
      type: object
      description: >-
        Create a durable event team (#720, #734). memberUserIds are the members in slot order: 1 or 2
        members (max 2, 2 is the normal case), independent of the event format. Omit name to auto-name
        from the members' display names.
      required:
        - memberUserIds
      properties:
        memberUserIds:
          type: array
          items:
            type: string
            format: uuid
        name:
          type: string
          nullable: true
          description: Optional name override; omit/blank to auto-name from members.

    UpdateEventTeamRequest:
      type: object
      description: >-
        Update a durable event team (#720). Fields left null are unchanged; a blank name re-auto-names
        from the members.
      properties:
        memberUserIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
        name:
          type: string
          nullable: true

    EventTeamMemberResponse:
      type: object
      description: One resolved member of a durable event team (#720).
      required:
        - userId
        - position
      properties:
        userId:
          type: string
          format: uuid
        position:
          type: integer
          description: Slot within the team (1 = Player 1, 2 = Player 2).
        displayName:
          type: string
          nullable: true
        publicCode:
          type: string
          nullable: true
        isPlaceholder:
          type: boolean
        isDeleted:
          type: boolean

    EventTeamResponse:
      type: object
      description: A durable, event-scoped organizational team (#720).
      required:
        - id
        - eventId
        - name
        - members
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        name:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/EventTeamMemberResponse'

    EventPublicResponse:
      type: object
      description: Read-only public summary of an event (#138) — details, roster, and its matches.
      required:
        - publicCode
        - name
        - startDate
        - endDate
        - participants
        - matches
      properties:
        publicCode:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        clubName:
          type: string
          nullable: true
          description: The organizing club's name (#313), read-only; null for a clubless ("Open") event.
        isActive:
          type: boolean
          description: False once the event is soft-deleted (#325); the public page flags it as deleted.
        participants:
          type: array
          items:
            $ref: '#/components/schemas/EventParticipantResponse'
        matches:
          type: array
          items:
            $ref: '#/components/schemas/MatchPublicResponse'
        viewerStatus:
          type: string
          nullable: true
          enum: [APPROVED, PENDING, HOLD]
          description: The viewer's own standing on this event (#201); null if not signed up.
        format:
          type: string
          enum: [SINGLES, DOUBLES, MIXED_DOUBLES]
          description: The event's organizing format (#720/#741).
        type:
          type: string
          enum: [OPEN_PLAY, TOURNAMENT]
          description: The event's class (#403/#741).
        isFinalized:
          type: boolean
          description: >-
            True once the event has been finalized (#403/#741). The public page renders the Finalized
            badge from this and withholds "Request to join" — a finalized event takes no joiners.
        awardRankingPoints:
          type: boolean
          description: Whether finalizing this event awards ranking points per the global schedules (#559/#741).

    MatchPublicPlayer:
      type: object
      description: One player on the public match page (#136) — name + shareable code only.
      properties:
        displayName:
          type: string
          nullable: true
        publicCode:
          type: string
          nullable: true
        isPlaceholder:
          type: boolean
          description: True for a login-less, not-yet-claimed placeholder player (#496/#505); the roster shows an "Unclaimed" tag beside the name.

        isDeleted:
          type: boolean
          description: True for an admin-soft-deleted account (#518); rendered as a dominant "Deleted" chip wherever the name appears.
    UpcomingMatchResponse:
      type: object
      description: A caller's upcoming (scheduled) match for their private profile (#251).
      required:
        - publicCode
        - matchDate
        - matchType
        - opponents
      properties:
        publicCode:
          type: string
        matchDate:
          type: string
          format: date
        matchType:
          type: string
        venue:
          type: string
          nullable: true
        opponents:
          type: array
          items:
            $ref: '#/components/schemas/MatchPublicPlayer'

    MatchPublicSet:
      type: object
      required:
        - setNumber
        - team1Games
        - team2Games
      properties:
        setNumber:
          type: integer
        team1Games:
          type: integer
        team2Games:
          type: integer
        tiebreakTeam1Points:
          type: integer
          nullable: true
        tiebreakTeam2Points:
          type: integer
          nullable: true

    MatchPublicResponse:
      type: object
      description: Read-only public summary of a match (#136), addressed by its public code.
      required:
        - publicCode
        - matchFormat
        - matchType
        - matchDate
        - status
        - team1
        - team2
        - winner
        - sets
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: >-
            The internal match id, revealed to ADMINISTRATOR viewers only (#776) so the public page's
            score-correction action can address the match. Null for every other viewer.
        publicCode:
          type: string
        matchFormat:
          type: string
        matchType:
          type: string
        matchDate:
          type: string
          format: date
        status:
          type: string
        rated:
          type: boolean
          description: >-
            True once the rating calculation has committed this match (#361); lets a list view
            derive the Scheduled / Awaiting rating / Rated status without the precise rating changes.
        reRated:
          type: boolean
          description: >-
            True once an ADMINISTRATOR has corrected this match's score AFTER it was rated (#776).
            Public on purpose — a transparency signal that the recorded score changed, shown to
            everyone rather than only to staff. Drives the "Re-rated" badge.
        isActive:
          type: boolean
          description: False once the match is soft-deleted (#325); the public page flags it as deleted.
        team1:
          type: array
          items:
            $ref: '#/components/schemas/MatchPublicPlayer'
        team2:
          type: array
          items:
            $ref: '#/components/schemas/MatchPublicPlayer'
        winner:
          type: string
          enum: [TEAM1, TEAM2, NONE]
        sets:
          type: array
          items:
            $ref: '#/components/schemas/MatchPublicSet'
        venue:
          type: string
          nullable: true
        tournamentName:
          type: string
          nullable: true
        ratingChanges:
          type: array
          nullable: true
          description: >-
            Per-player rating change, present only once the match is rated. The NTRP bands
            (previousLevel/newLevel) are shown to everyone; the precise rates are populated
            only for RATER/ADMINISTRATOR viewers.
          items:
            $ref: '#/components/schemas/MatchPublicRatingChange'
        headToHead:
          allOf:
            - $ref: '#/components/schemas/MatchPublicHeadToHead'
          nullable: true
          description: >-
            Prior meetings between the same two players (#188); null when there are none or the
            match is not singles. Wins and set scores are oriented to team1/team2 of this match.
        event:
          allOf:
            - $ref: '#/components/schemas/MatchPublicEvent'
          nullable: true
          description: >-
            The event this match belongs to (#358), resolved to its shareable code + name so the
            public page can link to the event. Null/omitted for eventless (open-play) matches.
        team1Handicap:
          type: string
          nullable: true
          description: Per-side rating handicap (#486) for team1, shown transparently to participants; null = none.
        team2Handicap:
          type: string
          nullable: true
          description: Per-side rating handicap (#486) for team2, shown transparently to participants; null = none.

    MatchPublicEvent:
      type: object
      description: >-
        The event a match belongs to (#358), for a link from the public match page to the event's
        public page. Only the non-sensitive shareable code + display name are exposed.
      required:
        - publicCode
        - name
      properties:
        publicCode:
          type: string
        name:
          type: string

    MatchPublicHeadToHead:
      type: object
      description: Head-to-head record between a singles match's two players (#188).
      required:
        - team1Wins
        - team2Wins
        - meetings
      properties:
        team1Wins:
          type: integer
          description: Prior wins for team1's player (oriented to this match).
        team2Wins:
          type: integer
          description: Prior wins for team2's player (oriented to this match).
        meetings:
          type: array
          description: Prior completed meetings, newest first, excluding the match being viewed.
          items:
            $ref: '#/components/schemas/MatchPublicHeadToHeadEntry'

    MatchPublicHeadToHeadEntry:
      type: object
      description: One prior meeting in a head-to-head record (#188).
      required:
        - publicCode
        - matchDate
        - status
        - rated
        - matchFormat
        - sets
      properties:
        publicCode:
          type: string
        matchDate:
          type: string
          format: date
        status:
          type: string
        rated:
          type: boolean
        matchFormat:
          type: string
          description: SINGLES, DOUBLES, or MIXED_DOUBLES — whether the meeting was singles or doubles (#285).
        sets:
          type: array
          description: Set scores oriented to team1/team2 of the match being viewed.
          items:
            $ref: '#/components/schemas/MatchPublicSet'
        winnerPublicCode:
          type: string
          nullable: true
          description: The winning player's public code (one of the two), or null if undecided.

    MatchPublicRatingChange:
      type: object
      description: One player's rating change for a rated match (#136).
      properties:
        publicCode:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        previousLevel:
          type: string
          nullable: true
          description: Public NTRP band before the match (shown to everyone).
        newLevel:
          type: string
          nullable: true
          description: Public NTRP band after the match (shown to everyone).
        previousRating:
          type: string
          nullable: true
          description: Precise rate before the match (6 fractional digits); null unless viewer is RATER/ADMINISTRATOR.
        newRating:
          type: string
          nullable: true
          description: Precise rate after the match (6 fractional digits); null unless viewer is RATER/ADMINISTRATOR.
        ratingChange:
          type: string
          nullable: true
          description: Precise net change (6 fractional digits); null unless viewer is RATER/ADMINISTRATOR.
        confidence:
          type: string
          nullable: true
          description: The player's current rating confidence 0..1 (#343), shown as a %; 0 when not match-derived.
        isPlaceholder:
          type: boolean
          description: True for a login-less, not-yet-claimed placeholder player (#496/#505); the row shows an "Unclaimed" tag beside the name.

        isDeleted:
          type: boolean
          description: True for an admin-soft-deleted account (#518); rendered as a dominant "Deleted" chip wherever the name appears.
    CalculationRequest:
      type: object
      properties:
        dryRun:
          type: boolean
          default: true
          description: Defaults to true (preview only); set false to commit.
        eventIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
          description: >-
            Optional selection of finalized events to scope the run to (#479). Omit or leave empty to
            process all pending matches (unchanged). When provided, the selection must be a contiguous
            prefix of the pending timeline — you may not select an event while an older pending match
            is excluded — otherwise the request is rejected with a 400 (Validation error) naming the
            earliest excluded match. Applies to both preview and commit.

    PlayerChangeResponse:
      type: object
      required:
        - userId
        - previousRating
        - newRating
        - change
        - percentChange
        - levelChanged
        - breakdown
      properties:
        userId:
          type: string
          format: uuid
        previousRating:
          type: string
        newRating:
          type: string
        change:
          type: string
        percentChange:
          type: string
        previousLevel:
          type: string
          nullable: true
        newLevel:
          type: string
          nullable: true
        levelChanged:
          type: boolean
        breakdown:
          $ref: '#/components/schemas/CalculationBreakdownResponse'

    CalculationBreakdownResponse:
      type: object
      description: >-
        Internal calculator derivatives behind a player's change (issue #89); all values are precise decimal strings.
        The net fields are present for the v1 (averaged) calculator and null for v2, which reports per-set steps in `sets` (#110).
      properties:
        dominance:
          type: string
          nullable: true
          description: Average per-set game-margin dominance, -1.0..1.0. Null for the v2 per-set calculator.
        scale:
          type: string
          nullable: true
          description: Upset factor (underdog won) or competitive factor (otherwise). Null for the v2 per-set calculator.
        ratingGap:
          type: string
          nullable: true
        normalizedGap:
          type: string
          nullable: true
          description: ratingGap / NTRP range.
        competitiveThresholdPct:
          type: string
          nullable: true
          description: Competitive threshold as a fraction of the NTRP range (0.083 ≈ 0.5 points).
        isUpset:
          type: boolean
          nullable: true
        upsetMultiplier:
          type: string
          nullable: true
        kFactor:
          type: string
          nullable: true
        sets:
          type: array
          description: Per-set steps for the v2 calculator (#110); empty for v1.
          items:
            $ref: '#/components/schemas/SetBreakdownResponse'

    SetBreakdownResponse:
      type: object
      description: One set's calculator derivatives behind a player's change (v2 per-set calculator, issue #110).
      required:
        - setIndex
        - score
        - dominance
        - scale
        - ratingGap
        - normalizedGap
        - competitiveThresholdPct
        - isUpset
        - upsetMultiplier
        - kFactor
        - delta
        - ratingAfter
      properties:
        setIndex:
          type: integer
          description: 0-based set position within the match.
        score:
          type: string
          description: This player's set score as "self-opponent" games (e.g. "6-2").
        dominance:
          type: string
        scale:
          type: string
        ratingGap:
          type: string
        normalizedGap:
          type: string
        competitiveThresholdPct:
          type: string
        isUpset:
          type: boolean
        upsetMultiplier:
          type: string
        kFactor:
          type: string
        delta:
          type: string
          description: The rating change contributed by this set.
        ratingAfter:
          type: string
          description: The player's in-match rating after this set.

    MatchCalculationResponse:
      type: object
      required:
        - matchId
        - matchDate
        - changes
      properties:
        matchId:
          type: string
          format: uuid
        matchDate:
          type: string
          format: date
        changes:
          type: array
          items:
            $ref: '#/components/schemas/PlayerChangeResponse'

    CalculationResponse:
      type: object
      required:
        - dryRun
        - matchesProcessed
        - matches
      properties:
        dryRun:
          type: boolean
        matchesProcessed:
          type: integer
        matches:
          type: array
          items:
            $ref: '#/components/schemas/MatchCalculationResponse'

    MatchCalculationDetailResponse:
      type: object
      description: A rated match's result with its stored per-player calculation (issue #97).
      required:
        - match
        - changes
      properties:
        match:
          $ref: '#/components/schemas/MatchResponse'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/MatchPlayerCalculationResponse'

    MatchPlayerCalculationResponse:
      type: object
      description: One player's stored calculation for a rated match, with their display name.
      required:
        - userId
        - previousRating
        - newRating
        - change
        - levelChanged
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        previousRating:
          type: string
        newRating:
          type: string
        change:
          type: string
        percentChange:
          type: string
          nullable: true
        previousLevel:
          type: string
          nullable: true
        newLevel:
          type: string
          nullable: true
        levelChanged:
          type: boolean
        breakdown:
          description: Absent for initial assessments and rows committed before the breakdown was persisted.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CalculationBreakdownResponse'

    ThemeResponse:
