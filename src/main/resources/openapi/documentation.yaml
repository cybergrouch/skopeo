          type: string
          description: NTRP band entering the window (label only), e.g. "3.0"; shared by both metrics.
        excursionToBand:
          type: string
          description: Farthest NTRP band reached in-window (label only) — the excursion endpoint (#289).
        excursionDistance:
          type: integer
          description: Absolute number of 0.5-wide bands from the entry band to the farthest band reached (#289).
        netToBand:
          type: string
          description: NTRP band at the window close (label only) — the net endpoint (#724).
        netDistance:
          type: integer
          description: Absolute number of 0.5-wide bands from the entry band to the closing band; a round-tripper reads 0 (#724).
        isPlaceholder:
          type: boolean
          description: True for a login-less, not-yet-claimed placeholder player (#496/#505); the report shows an "Unclaimed" tag beside the name.

        isDeleted:
          type: boolean
          description: True for an admin-soft-deleted account (#518); rendered as a dominant "Deleted" chip wherever the name appears.
    BandHopBucket:
      type: object
      required:
        - hopDistance
        - count
        - users
      properties:
        hopDistance:
          type: integer
          description: Absolute number of 0.5-wide bands moved under this bucketing (0 = stayed in band).
        count:
          type: integer
        users:
          type: array
          items:
            $ref: '#/components/schemas/BandHopUserRow'

    BandHopReportResponse:
      type: object
      required:
        - startDate
        - endDate
        - totalPlayers
        - excursionStayedCount
        - excursionJumpedCount
        - excursionBuckets
        - netStayedCount
        - netJumpedCount
        - netBuckets
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        totalPlayers:
          type: integer
        excursionStayedCount:
          type: integer
          description: Players whose farthest-band excursion was 0 (stayed within their band) (#289).
        excursionJumpedCount:
          type: integer
          description: Players whose farthest-band excursion was at least one band (#289).
        excursionBuckets:
          type: array
          description: Players bucketed by farthest-band excursion distance, ascending (includes the 0 bucket).
          items:
            $ref: '#/components/schemas/BandHopBucket'
        netStayedCount:
          type: integer
          description: Players whose net (closing-band) movement was 0; includes round-trippers (#724).
        netJumpedCount:
          type: integer
          description: Players whose net (closing-band) movement was at least one band (#724).
        netBuckets:
          type: array
          description: Players bucketed by net (closing-band) distance, ascending (includes the 0 bucket).
          items:
            $ref: '#/components/schemas/BandHopBucket'

    CreatePlayerListRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    AddMemberRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          format: uuid

    PlayerListSummaryResponse:
      type: object
      required:
        - id
        - name
        - createdAt
        - memberCount
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
        memberCount:
          type: integer

    PlayerListResponse:
      type: object
      required:
        - id
        - name
        - createdAt
        - members
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/UserSummaryResponse'

    SeedingEntryResponse:
      type: object
      required:
        - position
        - publicCode
      properties:
        seed:
          type: integer
          nullable: true
        position:
          type: integer
        userId:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        publicCode:
          type: string
        ntrpBand:
          type: string
          nullable: true
        rating:
          type: string
          nullable: true
          description: The exact rating — populated for an ADMINISTRATOR viewer only (#583); null otherwise.
        sex:
          type: string
          nullable: true
        age:
          type: integer
          nullable: true
        isPlaceholder:
          type: boolean
          description: True for a login-less, not-yet-claimed placeholder player (#496/#505); the seeding view shows an "Unclaimed" tag beside the name.

        isDeleted:
          type: boolean
          description: True for an admin-soft-deleted account (#518); rendered as a dominant "Deleted" chip wherever the name appears.
    SeedingResponse:
      type: object
      required:
        - generatedAt
        - entries
      properties:
        generatedAt:
          type: string
        manuallyEdited:
          type: boolean
          description: True when a host drag-reordered and saved this seeding by hand (#718); false for a plain generated one. The web UI warns before a Regenerate would discard a manual order.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SeedingEntryResponse'
    SaveSeedingOrderRequest:
      type: object
      required:
        - userIds
      properties:
        userIds:
          type: array
          description: The seedable players' user ids in the host's desired order (#718); a permutation of the current seedable set. Seeds are renumbered 1..N by this position.
          items:
            type: string
            format: uuid

    StandingEntryResponse:
      type: object
      required:
        - rank
        - userId
        - publicCode
      properties:
        rank:
          type: integer
        userId:
          type: string
        displayName:
          type: string
          nullable: true
        publicCode:
          type: string
        sex:
          type: string
          nullable: true
        age:
          type: integer
          nullable: true
        currentRating:
          type: string
          nullable: true
          description: >-
            Precise NTRP rating (6 fractional digits); the RATING-source metric, present only for
            RATER/ADMINISTRATOR viewers (#186), null for everyone else and under the POINTS source.
        points:
          type: string
          nullable: true
          description: >-
            The row's points total (snapshot ordering value); the POINTS-source metric, present
            (public, #64/#114/#457) for every viewer when source=POINTS, null under RATING.
        isPlaceholder:
          type: boolean
          description: True for a login-less, not-yet-claimed placeholder player (#496/#505); the leaderboard shows an "Unclaimed" tag beside the name.

        isDeleted:
          type: boolean
          description: True for an admin-soft-deleted account (#518); rendered as a dominant "Deleted" chip wherever the name appears.
    StandingsGroupResponse:
      type: object
      description: A selectable (band, sex) group present in the current snapshot (#220).
      required:
        - band
        - label
      properties:
        band:
          type: string
          description: The band code (e.g. "4.0") to pass as the `band` query parameter.
        label:
          type: string
          description: The human-readable band header (e.g. "NTRP 4.0 Band Race").
        sex:
          type: string
          nullable: true
          description: The group's sex ("Male"/"Female"), or null for the Unspecified group.

    StandingsBandResponse:
      type: object
      description: One NTRP band selector (#113), listed whether or not it currently has ranked players.
      required:
        - code
        - label
      properties:
        code:
          type: string
          description: The band code (e.g. "4.0") to pass as the `band` query parameter.
        label:
          type: string
          description: The human-readable band header (e.g. "NTRP 4.0 Band Race").

    StandingsPageResponse:
      type: object
      description: >-
        One page of a (band, sex) leaderboard from the latest published snapshot (#220), plus the
        group's total, the (band, sex) selectors with data, and every NTRP band for the dropdown.
        Ranks restart at 1 within each group.
      required:
        - limit
        - offset
        - total
        - entries
        - groups
        - bands
        - source
      properties:
        band:
          type: string
          nullable: true
          description: The band code served (null only for an empty snapshot).
        label:
          type: string
          nullable: true
          description: The served band's human-readable header.
        sex:
          type: string
          nullable: true
          description: The group's sex ("Male"/"Female"), or null for the Unspecified group.
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
          description: The full size of the (band, sex) group (for pagination).
        entries:
          type: array
          items:
            $ref: '#/components/schemas/StandingEntryResponse'
        groups:
          type: array
          description: The (band, sex) selectors that actually have ranked players in this snapshot.
          items:
            $ref: '#/components/schemas/StandingsGroupResponse'
        bands:
          type: array
          description: Every NTRP band (strongest-first) for the dropdown, including bands with no data.
          items:
            $ref: '#/components/schemas/StandingsBandResponse'
        source:
          type: string
          enum:
            - RATING
            - POINTS
          description: >-
            The effective serving source. RATING is computed live from current ratings; POINTS is served
            from the latest published points snapshot. When source is POINTS and no snapshot exists the
            entries are empty (an explicit points empty state), never a silent fallback to ratings.

    StandingsLocateResponse:
      type: object
      description: The caller's location in the current standings plus the containing page offset (#220).
      required:
        - band
        - label
        - rank
        - limit
        - offset
      properties:
        band:
          type: string
        label:
          type: string
        sex:
          type: string
          nullable: true
        rank:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    StandingsCalculationRequest:
      type: object
      description: >-
        Body for the points-based standings recompute (#146 phase 2). dryRun defaults to true (preview
        only); set it explicitly to false to publish a POINTS snapshot.
      properties:
        dryRun:
          type: boolean
          default: true

    StandingsCalculationEntryResponse:
      type: object
      description: One ranked player in a recomputed (band, sex) group — points total + tie-break rating (#146).
      required:
        - rank
        - userId
        - publicCode
        - points
      properties:
        rank:
          type: integer
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        publicCode:
          type: string
        points:
          type: string
          description: The player's summed counting points for this (band, sex) as a decimal string.
        currentRating:
          type: string
          nullable: true
          description: The player's current rating (the D8 tie-break input); null when unrated.

    StandingsCalculationGroupResponse:
      type: object
      description: One recomputed (band, sex) race, ranked by points descending (#146).
      required:
        - band
        - entries
      properties:
        band:
          type: string
        sex:
          type: string
          nullable: true
        entries:
          type: array
          items:
            $ref: '#/components/schemas/StandingsCalculationEntryResponse'

    StandingsCalculationResponse:
      type: object
      description: The points-based recompute outcome (#146) — whether it was a dry run, plus the ranked groups.
      required:
        - dryRun
        - groupsComputed
        - groups
      properties:
        dryRun:
          type: boolean
        groupsComputed:
          type: integer
        groups:
          type: array
          items:
            $ref: '#/components/schemas/StandingsCalculationGroupResponse'

    GrantRankingPointsRequest:
      type: object
      description: Body for granting a ranking-point award (#146). points is a decimal string.
      required:
        - points
        - pointClass
      properties:
        points:
          type: string
          description: The award amount as a decimal string (must be > 0).
        pointClass:
          type: string
          enum:
            - ANNUAL_TOURNAMENT
            - SEASONAL_TOURNAMENT_1M
            - SEASONAL_TOURNAMENT_3M
            - SEASONAL_TOURNAMENT_6M
            - OPEN_PLAY
            - EXTERNAL
        sourceType:
          type: string
          enum:
            - INTERNAL
            - EXTERNAL
          default: INTERNAL
        sourceId:
          type: string
          nullable: true
          description: Provenance reference (a system id or a free-text external ref).
        band:
          type: string
          nullable: true
          description: Optional NTRP band override; defaults to the target's current band.
        reason:
          type: string
          nullable: true
          description: Human-readable justification; required for an EXTERNAL / ad-hoc grant.
        validFrom:
          type: string
          format: date-time
          nullable: true
          description: Optional start of the validity window; defaults to now.
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: Optional end of the validity window; defaults from the point-class policy.

    AdjustRankingPointsRequest:
      type: object
      description: >-
        Body for a manual signed point adjustment (#469). All fields are mandatory. points is a signed
        integer as a decimal string (positive awards, negative deducts; non-zero, whole).
      required:
        - points
        - reason
        - validFrom
        - validUntil
      properties:
        points:
          type: string
          description: The signed adjustment as a decimal string (non-zero, whole; positive awards, negative deducts).
        reason:
          type: string
          description: The comment / rationale for the adjustment (required).
        validFrom:
          type: string
          format: date-time
          description: Start of the validity window.
        validUntil:
          type: string
          format: date-time
          description: End of the validity window (must be after validFrom).

    RevokeRankingPointsRequest:
      type: object
      description: Body for revoking a ranking-point award (#146) — an optional reason.
      properties:
        reason:
          type: string
          nullable: true

    RankingPointAwardResponse:
      type: object
      description: One ranking-points ledger row (#146). Points and timestamps are strings.
      required:
        - id
        - userId
        - points
        - pointClass
        - sourceType
        - band
        - sex
        - validFrom
        - validUntil
        - status
        - awardedAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        points:
          type: string
        pointClass:
          type: string
        sourceType:
          type: string
        sourceId:
          type: string
          nullable: true
        band:
          type: string
        sex:
          type: string
        reason:
          type: string
          nullable: true
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        status:
          type: string
          enum:
