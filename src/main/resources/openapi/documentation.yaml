        '200':
          description: The match result and stored calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchCalculationDetailResponse'
        '403':
          description: Forbidden
        '404':
          description: No such match, or no calculation has been committed for it

  /api/v1/matches/calculation-order:
    put:
      summary: Reorder same-date matches for calculation (staff; evented fixtures follow their club rule)
      description: |
        Set the manual calculation-order tiebreaker (#331/#332). The rating calculation orders matches
        by match date first, so this only re-sequences matches that share the same date. The request
        lists the match ids in the desired order; each is assigned its position. Rated matches are
        frozen and cannot be reordered.
      tags:
        - Matches
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderMatchesRequest'
      responses:
        '204':
          description: The order was updated
        '400':
          description: Empty/duplicate ids, a disabled match, or matches spanning more than one date
        '403':
          description: >-
            Caller is not staff, or — for a fixture that belongs to an event — may not organize that
            event (#789): not an ADMINISTRATOR, not a named owner of the event's club, and not the
            event's creator. A fixture with no event keeps the plain staff gate.
        '404':
          description: No such match
        '409':
          description: A listed match has already been rated

  /api/v1/matches/{id}/result:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Upload or edit match results (staff; an event's fixtures follow its club rule)
      description: |
        Records the set scores, derives the winner, and marks the match COMPLETED (pending
        calculation). Ratings are NOT computed here. May be called again to EDIT the result while the
        match is still unrated — the sets are replaced. Once the match has been rated, the result is
        frozen (409).
      tags:
        - Matches
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchResultRequest'
      responses:
        '200':
          description: Completed match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '400':
          description: Invalid scores or no clear winner
        '403':
          description: >-
            Caller is not staff, or — for a fixture that belongs to an event — may not organize that
            event (#789): not an ADMINISTRATOR, not a named owner of the event's club, and not the
            event's creator. A fixture with no event keeps the plain staff gate.
        '404':
          description: No such match
        '409':
          description: The match is disabled, or already rated (the result is frozen)

  /api/v1/matches/{id}/score-correction:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Correct the score of an already-rated match (ADMINISTRATOR only)
      description: >-
        Correct the score of a match that has ALREADY been rated (#776) — the rated-path complement of
        POST /result, which freezes a match once rated. Built for the mid-history case, where later matches
        have already been rated on top: rather than cascading a recalculation, each player's rating is moved
        by `current - oldDelta + newDelta`. `oldDelta` is the rating_change on the match's live history row,
        reversed verbatim; `newDelta` is recomputed for the corrected score from the player's rating AT THE
        TIME (that row's previous_rating), not from their present-day rating. Matches rated after this one
        are deliberately NOT re-rated — an accepted approximation, documented in
        docs/product/MATCH_SCORE_CORRECTION.md. In one transaction the score is replaced, the match's
        rating-history rows are superseded (soft-deleted via reversed_at) and replaced with rows stamped
        corrected_at, each player's current rating/level is adjusted, and a re-rated marker is stamped —
        while rated_at deliberately STAYS set so the match never re-enters the pending-calculation queue.
        The match's ranking points are revoked and re-issued (for a placement match, the event's whole
        placement set, since a player earns only their best placement). matches_played, last_match_date and
        the confidence bookkeeping are untouched; confidence (#459) is computed from match dates, so a
        score-only correction cannot move it. Dry-run is the DEFAULT — send `"dryRun": false` to write.
        Audited as MATCH_SCORE_CORRECTED (category MATCH_RESULT) plus MATCH_RATINGS_RE_RATED (category
        RATING_CALCULATION).
      tags:
        - Matches
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchScoreCorrectionRequest'
      responses:
        '200':
          description: The correction preview (dryRun) or the applied correction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchScoreCorrectionResponse'
        '400':
          description: Invalid scores or no clear winner
        '403':
          description: Caller is not an ADMINISTRATOR
        '404':
          description: No such match
        '409':
          description: >-
            The match is disabled, is not rated yet (edit the result normally instead), has no live rating
            history to reverse, or a player has no current rating

  /api/v1/matches/{id}/state:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Enable or disable a match (staff; an event's fixtures follow its club rule)
      description: |
        Append-only corrections: disable the original and add a new match. Disabling is allowed
        only while the match is unrated.
      tags:
        - Matches
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchStateRequest'
      responses:
        '200':
          description: Updated match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '403':
          description: >-
            Caller is not staff, or — for a fixture that belongs to an event — may not organize that
            event (#789): not an ADMINISTRATOR, not a named owner of the event's club, and not the
            event's creator. A fixture with no event keeps the plain staff gate.
        '404':
          description: No such match
        '409':
          description: Cannot disable a match that has already been rated

  /api/v1/matches/{id}/handicaps:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Set or clear a fixture's per-side rating handicaps (staff; an event's fixtures follow its club rule)
      description: >-
        Set (or clear) a fixture's per-side rating handicaps (#486). Each is a team-mean NTRP-unit value
        in the range 0 < h <= 1.0, or null to clear that side. A handicap is deducted from the designated
        side's rating for the rating-delta computation only (the delta is applied to the players' true
        ratings). Only allowed while the fixture is unrated (a rated match is frozen). See RATING_HANDICAP.md.
      tags:
        - Matches
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetHandicapsRequest'
      responses:
        '200':
          description: Updated match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '400':
          description: A handicap is out of range (must be 0 < h <= 1.0)
        '403':
          description: >-
            Caller is not staff, or — for a fixture that belongs to an event — may not organize that
            event (#789): not an ADMINISTRATOR, not a named owner of the event's club, and not the
            event's creator. A fixture with no event keeps the plain staff gate.
        '404':
          description: No such match
        '409':
          description: The match is disabled or already rated

  /api/v1/events:
    get:
      summary: List events (staff, scoped to the clubs the caller owns)
      description: >-
        An ADMINISTRATOR sees every active event. Anyone else sees the events of every club they are a
        named owner of, plus the events they created themselves (#789) — creator-only scoping was the
