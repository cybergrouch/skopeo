  /api/v1/clubs/code/{code}/events:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: bucket
        in: query
        required: true
        schema:
          type: string
          enum: [UPCOMING, UNFINALIZED, FINALIZED]
        description: >-
          Which grouping to page through (#483). Required — an absent or unknown value is a 400 rather
          than a silent default to a bucket the caller did not ask for.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Page size; coerced to 1..100, default 10.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Rows to skip; coerced to at least 0, default 0.
    get:
      summary: One page of a club's events in a single bucket
      description: >-
        One page of a club's events in a single grouping (#786), for the public club page's paginated
        cards. Viewable anonymously, like the club summary. The bucket predicates are evaluated in SQL,
        so this fetches and counts only the requested page rather than every event the club has run —
        which is the point: the club summary no longer carries an events list at all. FINALIZED is
        `finalized_at IS NOT NULL` and wins over dates and results; UNFINALIZED is not-finalized AND
        (ended before today OR has a recorded result); UPCOMING is not-finalized AND ends on/after today
        AND has no recorded result. Sort matches the Event Organizer: UPCOMING by start date ascending,
        UNFINALIZED by end date descending, FINALIZED by finalized_at descending.
      tags:
        - Clubs
      responses:
        '200':
          description: One page of the bucket, with that bucket's total
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubPublicEventsResponse'
        '400':
          description: Missing or unknown bucket
        '404':
          description: No such club

