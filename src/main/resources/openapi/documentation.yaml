    post:
      summary: Create an event (staff; a club must be one the caller owns)
      description: >-
        Filing the event under a club requires being a named owner of that club, or an ADMINISTRATOR
        (#789); previously only the club's existence was checked, so any host could file under any club.
        A clubless ("Open") event is open to any staff caller. An unknown club id is a 400, not a 403.
      tags:
        - Events
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
