ktor:
  application:
    id: skopeo
    modules:
      - org.skopeo.ApplicationKt.module
  deployment:
    port: 8080
    host: 0.0.0.0

firebase:
  # Firebase project id — the issuer/audience anchor for verifying ID tokens.
  # Defaults to the GCP project (skopeo-prod); override per-environment with
  # FIREBASE_PROJECT_ID. (A project id is public, not a secret.)
  projectId: "$FIREBASE_PROJECT_ID:skopeo-prod"

cors:
  # Comma-separated allowed web origins (scheme://host[:port]) for the browser SPA, e.g.
  # "https://skopeo.com,https://skopeo-prod.web.app". The localhost:5173 dev origin is always
  # allowed. Set per-environment via WEB_ORIGINS; empty/unset = localhost only.
  origins: "$WEB_ORIGINS:"

web:
  # Public site origin (scheme://host, no trailing slash) used to build canonical og:url + og:image and
  # to fetch the deployed index.html for per-page Open Graph tags (#238). Set per-environment via
  # WEB_SITE_ORIGIN; unset falls back to the production default (https://skopeo.co).
  origin: "$WEB_SITE_ORIGIN:https://skopeo.co"

docs:
  # Whether the unauthenticated interactive API docs (Swagger UI at /swagger + raw spec at
  # /openapi.yaml) are served (#599). Defaults to true; set DOCS_EXPOSED=false to disable them in a
  # hardened/externally-exposed deployment.
  exposed: "$DOCS_EXPOSED:true"

gcp:
  # GCP project id, used only to qualify the `logging.googleapis.com/trace` field so a log line links
  # to its request in Cloud Logging (#751). Cloud Logging ignores a bare trace id, so without this the
  # field is omitted rather than emitted unusable. Unset locally and in tests — the trace field is then
  # simply absent. Supplied in production from the same repo variable the deploy workflow already uses.
  projectId: "$GCP_PROJECT_ID:"

admin:
  # Comma-separated allowlist of emails auto-granted ADMINISTRATOR on sign-up/login, but ONLY when
  # the email is provider-verified (the verified-email gate). Bootstrap / break-glass only — everyday
  # admin grants go through the API. Source from Secret Manager; empty/unset = no auto-admins.
  # See docs/engineering/architecture/ADMIN_BOOTSTRAP.md.
  emails: "$ADMIN_EMAILS:"

database:
  url: "$DATABASE_URL:jdbc:postgresql://localhost:5432/SkopeoDb"
  driver: org.postgresql.Driver
  user: "$DATABASE_USER:postgres"
  password: "$DATABASE_PASSWORD:postgres"
  pool:
    maximumPoolSize: 10
    minimumIdle: 2
    connectionTimeout: 30000
    idleTimeout: 600000
    maxLifetime: 1800000
