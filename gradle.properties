# Let Gradle discover the JDKs that CI (actions/setup-java) installs. Since #1030 the compile
# toolchain and the daemon are BOTH Java 25, so only one entry is needed — but keep using fromEnv
# rather than a hardcoded path, because the location differs between CI and a developer machine.
# Harmless locally: Gradle ignores any of these env vars that aren't set.
org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64
