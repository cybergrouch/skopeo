# The daemon runs on 25 since #1008. It was pinned to 21 because detekt 1.23.8's bundled Kotlin
# compiler crashed on Java 25+ (https://github.com/detekt/detekt/issues/8714); detekt 2.0.0-alpha.6
# fixes it, and that was verified by running the full detekt gate on 25 rather than assumed from the
# changelog.
#
# Note the code TARGET is unchanged and stays Java 17 (JavaLanguageVersion.of(17) in build.gradle.kts).
# This is only which JVM Gradle itself, and therefore detekt, runs on.
toolchainVersion=25
