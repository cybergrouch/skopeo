name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write # dorny/test-reporter publishes the "Test Report" check run
  pull-requests: write # sticky coverage comments (marocchino/sticky-pull-request-comment)

# Cancel superseded runs on the same ref (e.g. new push to a PR)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Full history (not the default shallow depth-1) so diff-cover can walk the
        # commit ancestry to origin/main and compute patch (changed-lines) coverage.
        with:
          fetch-depth: 0

      # Install BOTH JDK 17 and 21. The last entry (21) becomes JAVA_HOME, so
      # Gradle's daemon — and detekt — run on 21. This is required: detekt 1.23.8
      # crashes on JDK 25+, which is why gradle/gradle-daemon-jvm.properties pins
      # the daemon to 21. The project still compiles with the Java 17 toolchain,
      # discovered via org.gradle.java.installations.fromEnv in gradle.properties.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, lint, detekt, test, verify coverage
        run: ./gradlew check

      # Quick overall coverage table on the run Summary page (even if the gate failed).
      # Captured to a file so the same markdown can be reused in the PR comment below.
      - name: Coverage summary
        if: always()
        run: |
          python3 scripts/coverage-summary.py | tee coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      # Drillable per-test report as a "Test Report" check; failures are expanded with
      # their stack trace and annotated on the source line.
      #
      # Only FAILED suites/tests are listed. A check run's summary is capped at 65,535 bytes by the
      # GitHub API, and listing all ~1,400 passing tests blew past it — the action would warn
      # ("summary is too big"), silently downgrade list-tests to 'failed' and then trim the markdown.
      # The conclusion and the annotations were always correct; what was lost was the tail of the
      # listing. Asking for failures only makes that explicit rather than a truncation, and nobody
      # scrolls a thousand green rows to find the one red one.
      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Report
          path: '**/build/test-results/test/TEST-*.xml'
          reporter: java-junit
          list-suites: failed
          list-tests: failed
          # Publish as a drillable "Test Report" check run (not just the run summary).
          use-actions-summary: 'false'

      # Patch (changed-lines) coverage against origin/main via diff-cover. JaCoCo package
      # names + sourcefile names resolve under src/main/kotlin, so diff-cover maps the
      # changed Kotlin lines to their coverage. Non-blocking: the gate is `./gradlew check`.
      - name: Backend patch coverage (diff-cover)
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        run: |
          pip install --quiet diff-cover
          diff-cover build/reports/jacoco/test/jacocoTestReport.xml \
            --compare-branch=origin/main \
            --src-roots src/main/kotlin \
            --format markdown:backend-patch.md || echo "_diff-cover produced no patch report._" > backend-patch.md

      # Sticky PR comment (updated in place across pushes) with overall + patch coverage.
      # Never fails the build.
      - name: Assemble backend coverage comment
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        run: |
          {
            echo "## 🧪 Backend coverage"
            echo
            if [ -f coverage-summary.md ]; then
              cat coverage-summary.md
            else
              echo "_No coverage report found._"
            fi
            echo
            echo "### Patch coverage (changed lines vs \`main\`)"
            echo
            if [ -f backend-patch.md ]; then
              cat backend-patch.md
            else
              echo "_No patch coverage computed._"
            fi
          } > backend-comment.md

      - name: Post backend coverage comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        with:
          header: coverage-backend
          path: backend-comment.md

  # Build the runtime image and actually START it.
  #
  # This exists because of a specific class of failure the test job cannot see: `build` runs the suite
  # on the runner's JVM and never enters the container, so a dependency shipping PRECOMPILED NATIVE code
  # can be perfectly green in CI and segfault the moment the image boots.
  #
  # That is not hypothetical. firebase-admin (#911) pulls in gRPC, whose bundled netty-tcnative .so is
  # built against glibc; the runtime image was Alpine (musl), and the JVM died in
  # netty_internal_tcnative_SSLContext_JNI_OnLoad before the server ever listened. Every test passed.
  # Only starting the image catches it, and the next production deploy would have been the thing that
  # found out.
  #
  # Deliberately runs with NO Firebase credentials: that is the supported default (the broadcaster
  # degrades to a no-op), so this also proves the app boots without a Firestore project.
  image-smoke:
    name: Image boots
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: SkopeoDb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Build the runtime image
        run: docker build -t skopeo:ci .

      - name: Start it
        run: |
          docker run -d --name skopeo-ci --network host \
            -e DATABASE_URL=jdbc:postgresql://localhost:5432/SkopeoDb \
            -e DATABASE_USER=postgres \
            -e DATABASE_PASSWORD=postgres \
            skopeo:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health > /dev/null; then
              echo "healthy after ${i}s"
              exit 0
            fi
            # Fail fast rather than burning the full timeout: a container that has already exited is
            # never going to answer, and the logs are the useful output.
            if [ "$(docker inspect -f '{{.State.Running}}' skopeo-ci)" != "true" ]; then
              echo "::error::the container exited before serving /health"
              docker logs skopeo-ci
              exit 1
            fi
            sleep 1
          done
          echo "::error::/health did not respond within 30s"
          docker logs skopeo-ci
          exit 1

      - name: Assert the JVM did not die in native code
        # A SIGSEGV can leave a container running long enough to look alive, so check explicitly rather
        # than inferring from the health probe.
        run: |
          if docker logs skopeo-ci 2>&1 | grep -qE "SIGSEGV|A fatal error has been detected"; then
            echo "::error::the JVM crashed in native code"
            docker logs skopeo-ci
            exit 1
          fi

      - name: Logs on failure
        if: failure()
        run: docker logs skopeo-ci || true

  # Secret scan: block commits that introduce API keys, tokens, or credentials.
  # gitleaks-action scans the commits in the push / PR (not full history), reads
  # .gitleaks.toml (which allowlists the already-rotated historical leak), and
  # fails the job on a finding. Mirrors the local pre-commit hook (installGitHooks).
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the action can diff the commit range
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Web client (web/): the orval client is generated from the backend OpenAPI
  # spec via npm pre-hooks (pretypecheck/prebuild), so typecheck and build prove
  # the frontend stays in sync with the API contract.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        # Full history so diff-cover can diff frontend coverage against origin/main.
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (generates the API client)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (JUnit report + coverage)
        run: npm run test:ci

      - name: Build
        run: npm run build

      # Drillable per-test report as a "Web Test Report" check (mirrors the API's
      # Test Report); failures expand with their assertion and source location.
      # Failures only, for the same 65,535-byte reason as the backend report above — the web suite is
      # ~1,200 tests and heading the same way.
      - name: Web test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Web Test Report
          path: web/test-results/junit.xml
          reporter: jest-junit
          list-suites: failed
          list-tests: failed
          use-actions-summary: 'false'

      # Overall coverage from the vitest v8 lcov, plus patch (changed-lines) coverage
      # via diff-cover. The lcov's SF paths are relative to web/, so they are prefixed
      # with web/ to become repo-relative before diff-cover diffs against origin/main.
      # Non-blocking: the coverage gate stays in `./gradlew check` (backend) / vitest.
      - name: Web patch coverage (diff-cover)
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        working-directory: .
        run: |
          pip install --quiet diff-cover
          # lcov overall (line coverage summed from DA records).
          python3 - <<'PY' > web-overall.md
          total = covered = 0
          try:
              with open("web/coverage/lcov.info") as f:
                  for line in f:
                      if line.startswith("DA:"):
                          _, hits = line[3:].split(",")
                          total += 1
                          if int(hits) > 0:
                              covered += 1
          except FileNotFoundError:
              print("_No coverage report found._")
          else:
              pct = f"{100 * covered // total}% ({covered}/{total})" if total else "—"
              print("| Metric | Coverage |")
              print("|--------|----------|")
              print(f"| Lines | {pct} |")
          PY
          # Repo-relative lcov paths (web/src/...) so diff-cover matches git diff paths.
          sed 's|^SF:src/|SF:web/src/|' web/coverage/lcov.info > web/coverage/lcov-rooted.info
          diff-cover web/coverage/lcov-rooted.info \
            --compare-branch=origin/main \
            --format markdown:web-patch.md || echo "_diff-cover produced no patch report._" > web-patch.md

      - name: Assemble web coverage comment
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        working-directory: .
        run: |
          {
            echo "## 🧪 Web coverage"
            echo
            if [ -f web-overall.md ]; then
              cat web-overall.md
            else
              echo "_No coverage report found._"
            fi
            echo
            echo "### Patch coverage (changed lines vs \`main\`)"
            echo
            if [ -f web-patch.md ]; then
              cat web-patch.md
            else
              echo "_No patch coverage computed._"
            fi
          } > web-comment.md

      - name: Post web coverage comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        with:
          header: coverage-web
          path: web-comment.md
