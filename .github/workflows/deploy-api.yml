name: Deploy API

# Deploys the Ktor API to GCP Cloud Run. Release-driven — NOT on every merge. Triggered only by
# workflow_dispatch:
#   * tag-and-ship.yml dispatches it for the release tag once a `release: vX.Y.Z` PR lands on main,
#     so /health reports the tag's version (build.gradle.kts → version.properties).
#   * Run it manually from the Actions tab against any ref (e.g. main = the -SNAPSHOT dev build).
# Keyless auth via Workload Identity Federation (CICD.md C4) — no service-account JSON is stored.
# Inert until configured: the job is skipped unless the WIF_PROVIDER repo variable is set.
# Production deploys wait on the `production` GitHub Environment's manual-approval gate.
# Flyway migrations run on app startup (DatabaseConfig.init), so the new revision migrates as it boots.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation OIDC

concurrency:
  group: deploy-api
  cancel-in-progress: false # never cancel an in-flight deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip entirely until WIF is configured (keeps merges green before GCP exists).
    if: ${{ vars.WIF_PROVIDER != '' }}
    # Manual-approval gate: configure required reviewers on the `production` environment in repo settings.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Build from source (Cloud Build uses the repo Dockerfile) and deploy.
      # Non-secret runtime config comes from repo *variables*; DB password and the admin
      # allowlist come from Secret Manager via --set-secrets.
      #
      # WEB_ORIGINS is a comma-separated CORS allow-list (e.g. the custom apex + the Firebase
      # default), so we set env vars with gcloud's alternate-delimiter syntax: the leading "^##^"
      # makes "##" the separator between assignments, leaving commas *inside* WEB_ORIGINS intact.
      # With the default comma delimiter, a multi-origin WEB_ORIGINS would be mis-parsed.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE || 'skopeo' }}" \
            --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION || 'asia-southeast1' }}" \
            --allow-unauthenticated \
            --min-instances=1 --max-instances=2 \
            --network=default --subnet=default \
            --add-cloudsql-instances "${{ vars.CLOUDSQL_INSTANCE }}" \
            --set-env-vars "^##^FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}##DATABASE_URL=${{ vars.DATABASE_URL }}##DATABASE_USER=${{ vars.DATABASE_USER }}##WEB_ORIGINS=${{ vars.WEB_ORIGINS }}" \
            --set-secrets "DATABASE_PASSWORD=skopeo-db-password:latest,ADMIN_EMAILS=skopeo-admin-emails:latest" \
            --quiet

      # Post-deploy smoke check: does the browser's CORS preflight actually pass?
      #
      # The SPA calls the API cross-origin, so every request is gated by a preflight the server must
      # approve. Ktor's CORS plugin rejects the WHOLE preflight when any requested header or method is
      # unknown, which takes down every API call at once rather than degrading one route. This has now
      # bitten twice — PATCH once, then the X-Client-Version header (#752) — and neither was reachable
      # locally, because the Vite dev proxy makes /api same-origin and never preflights.
      #
      # So assert it against the deployed revision, from the real browser origin, with the headers the
      # bundle actually sends. A 403 (or a missing Access-Control-Allow-Origin) fails the deploy.
      - name: Verify CORS preflight from the web origin
        run: |
          set -euo pipefail
          SERVICE_URL=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE || 'skopeo' }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION || 'asia-southeast1' }}" \
            --format='value(status.url)')
          # The first configured web origin is the one the browser will actually send.
          ORIGIN="${WEB_ORIGINS%%,*}"
          if [ -z "${ORIGIN}" ]; then
            echo "::error::WEB_ORIGINS is empty, so the API allows no browser origin at all."
            exit 1
          fi
          echo "Preflighting ${SERVICE_URL}/api/v1/theme from ${ORIGIN}"

          RESPONSE=$(curl -sS -o /dev/null -D - -X OPTIONS "${SERVICE_URL}/api/v1/theme" \
            -H "Origin: ${ORIGIN}" \
            -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: ${REQUEST_HEADERS}" \
            --max-time 30)
          echo "${RESPONSE}"

          STATUS=$(printf '%s' "${RESPONSE}" | head -n 1 | awk '{print $2}')
          if [ "${STATUS}" != "200" ]; then
            echo "::error::CORS preflight returned ${STATUS} — the browser will block every API call from ${ORIGIN}."
            exit 1
          fi
          if ! printf '%s' "${RESPONSE}" | grep -qi '^access-control-allow-origin:'; then
            echo "::error::CORS preflight passed with 200 but carried no Access-Control-Allow-Origin header."
            exit 1
          fi
          echo "CORS preflight OK."
        env:
          WEB_ORIGINS: ${{ vars.WEB_ORIGINS }}
          # Every non-simple header the web bundle sends. Add to this list when the client does
          # (web/src/api/axios.ts), so the deploy fails here rather than in someone's browser.
          REQUEST_HEADERS: authorization,content-type,x-client-version
